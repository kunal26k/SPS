an class=\"v\">₹ 4,000<\/span><\/div>\n              <div class=\"brk-line\"><span class=\"k\">Special Allowance<\/span><span class=\"v\">₹ 8,200<\/span><\/div>\n              <div class=\"brk-line\"><span class=\"k\">Class-teacher Allowance<\/span><span class=\"v\">₹ 2,000<\/span><\/div>\n              <div class=\"brk-line\"><span class=\"k\">Performance Bonus (Apr)<\/span><span class=\"v\">₹ 1,500<\/span><\/div>\n              <div class=\"brk-line total\"><span class=\"k\">Gross Earnings<\/span><span class=\"v\">₹ 68,900<\/span><\/div>\n            <\/div>\n            <div class=\"brk-col\">\n              <h5>Deductions<\/h5>\n              <div class=\"brk-line\"><span class=\"k\">Provident Fund (12%)<\/span><span class=\"v\">₹ 4,560<\/span><\/div>\n              <div class=\"brk-line\"><span class=\"k\">Professional Tax<\/span><span class=\"v\">₹ 200<\/span><\/div>\n              <div class=\"brk-line\"><span class=\"k\">TDS (Income Tax)<\/span><span class=\"v\">₹ 1,300<\/span><\/div>\n              <div class=\"brk-line\"><span class=\"k\">Loss of pay (1 leave)<\/span><span class=\"v\">₹ 0<\/span><\/div>\n              <div class=\"brk-line\"><span class=\"k\">Health insurance contribution<\/span><span class=\"v\">₹ 0<\/span><\/div>\n              <div class=\"brk-line\"><span class=\"k\">&nbsp;<\/span><span class=\"v\">&nbsp;<\/span><\/div>\n              <div class=\"brk-line total deduct\"><span class=\"k\">Total Deductions<\/span><span class=\"v\">₹ 6,060<\/span><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"brk-net\">\n            <div class=\"k\">Net Salary Payable<\/div>\n            <div class=\"v\"><span class=\"cur\">₹<\/span>62,840<\/div>\n          <\/div>\n        <\/div>\n\n        <!-- History -->\n        <div class=\"sal-history\">\n          <h4>Payslip History<\/h4>\n          <table class=\"sal-tbl\">\n            <thead>\n              <tr>\n                <th>Month<\/th>\n                <th>Working Days<\/th>\n                <th>Present<\/th>\n                <th>Gross<\/th>\n                <th>Deductions<\/th>\n                <th>Net Credited<\/th>\n                <th>Status<\/th>\n                <th>Credited on<\/th>\n                <th>Payslip<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>\n              <tr>\n                <td>May 2026<\/td>\n                <td>22<\/td>\n                <td>—<\/td>\n                <td>₹ 68,900<\/td>\n                <td>₹ 6,060<\/td>\n                <td class=\"amt\">₹ 62,840<\/td>\n                <td><span class=\"pill processing\">Processing<\/span><\/td>\n                <td>Expected 31 May<\/td>\n                <td><button class=\"dl\" disabled style=\"opacity:0.5;cursor:not-allowed;\">PDF<\/button><\/td>\n              <\/tr>\n              <tr>\n                <td>April 2026<\/td>\n                <td>23<\/td>\n                <td>23<\/td>\n                <td>₹ 68,900<\/td>\n                <td>₹ 6,060<\/td>\n                <td class=\"amt\">₹ 62,840<\/td>\n                <td><span class=\"pill credited\">Credited<\/span><\/td>\n                <td>30 Apr 2026<\/td>\n                <td><button class=\"dl\" onclick=\"showToast('Payslip downloaded','success')\">PDF<\/button><\/td>\n              <\/tr>\n              <tr>\n                <td>March 2026<\/td>\n                <td>24<\/td>\n                <td>22<\/td>\n                <td>₹ 65,400<\/td>\n                <td>₹ 5,820<\/td>\n                <td class=\"amt\">₹ 59,580<\/td>\n                <td><span class=\"pill credited\">Credited<\/span><\/td>\n                <td>31 Mar 2026<\/td>\n                <td><button class=\"dl\" onclick=\"showToast('Payslip downloaded','success')\">PDF<\/button><\/td>\n              <\/tr>\n              <tr>\n                <td>February 2026<\/td>\n                <td>22<\/td>\n                <td>22<\/td>\n                <td>₹ 65,400<\/td>\n                <td>₹ 5,820<\/td>\n                <td class=\"amt\">₹ 59,580<\/td>\n                <td><span class=\"pill credited\">Credited<\/span><\/td>\n                <td>28 Feb 2026<\/td>\n                <td><button class=\"dl\" onclick=\"showToast('Payslip downloaded','success')\">PDF<\/button><\/td>\n              <\/tr>\n              <tr>\n                <td>January 2026<\/td>\n                <td>23<\/td>\n                <td>21<\/td>\n                <td>₹ 65,400<\/td>\n                <td>₹ 5,820<\/td>\n                <td class=\"amt\">₹ 56,460<\/td>\n                <td><span class=\"pill credited\">Credited<\/span><\/td>\n                <td>31 Jan 2026<\/td>\n                <td><button class=\"dl\" onclick=\"showToast('Payslip downloaded','success')\">PDF<\/button><\/td>\n              <\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/div>\n\n    <\/div><!-- /content -->\n  <\/div><!-- /main -->\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n\n  <script>\n    function showPanel(id, el) {\n      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));\n      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));\n      const panel = document.getElementById('panel-' + id);\n      if (panel) panel.classList.add('active');\n      if (el) el.classList.add('active');\n      const titles = {\n        dashboard: 'Dashboard', assignments: 'Assignment Manager',\n        create: 'Create Assignment', analytics: 'Class Analytics',\n        students: 'My Students',\n        attendance: 'My Attendance', salary: 'My Salary & Payslips'\n      };\n      document.getElementById('panel-title').textContent = titles[id] || id;\n      // Reset submissions view when re-entering\n      if (id === 'assignments') hideSubmissions();\n    }\n\n    function filterClass(btn, filter) {\n      document.querySelectorAll('.ctab').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n      document.querySelectorAll('.at-row').forEach(row => {\n        if (filter === 'all') { row.style.display = ''; return; }\n        const cls = row.dataset.class; const status = row.dataset.status;\n        row.style.display = (filter === cls || filter === status) ? '' : 'none';\n      });\n    }\n\n    function showSubmissions() {\n      document.getElementById('assignment-list-view').style.display = 'none';\n      const sv = document.getElementById('submissions-view');\n      sv.style.display = 'block';\n    }\n    function hideSubmissions() {\n      document.getElementById('assignment-list-view').style.display = 'block';\n      document.getElementById('submissions-view').style.display = 'none';\n    }\n\n    function saveGrade(btn) {\n      btn.textContent = '✓ Saved';\n      btn.classList.add('saved');\n      showToast('Grade saved — student notified!', 'success');\n      setTimeout(() => { btn.textContent = 'Save'; btn.classList.remove('saved'); }, 2500);\n    }\n    function markChanged(input) { /* live feedback */ }\n\n    function publishAssignment() {\n      const title = document.getElementById('asgn-title').value.trim();\n      const cls   = document.getElementById('asgn-class').value;\n      if (!title || !cls) { showToast('Please fill in the title and class.', 'info'); return; }\n      showToast('✅ Assignment published! Students & parents have been notified.', 'success');\n      setTimeout(() => showPanel('assignments', document.querySelector('[onclick*=assignments]')), 1200);\n    }\n\n    function showToast(msg, type='info') {\n      const t = document.getElementById('toast');\n      t.textContent = msg;\n      t.className = 'toast ' + type + ' show';\n      clearTimeout(window._toastTimer);\n      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3200);\n    }\n\n    // ── ATTENDANCE: live clock ──\n    function tickClock() {\n      const el = document.getElementById('liveClock'); if (!el) return;\n      const now = new Date();\n      let h = now.getHours(), m = now.getMinutes();\n      const ampm = h >= 12 ? 'PM' : 'AM';\n      h = h % 12; if (h === 0) h = 12;\n      el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;\n    }\n    setInterval(tickClock, 30000); tickClock();\n\n    function togglePunch() {\n      const btn = document.getElementById('punchBtn');\n      const out = document.getElementById('punchOutVal');\n      if (btn.classList.contains('done')) return;\n      const now = new Date();\n      let h = now.getHours(), m = now.getMinutes();\n      const ampm = h >= 12 ? 'PM' : 'AM';\n      h = h % 12; if (h === 0) h = 12;\n      out.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;\n      out.classList.remove('pending');\n      btn.textContent = '✓ Punched out — have a great evening';\n      btn.classList.add('done');\n      showToast('Punched out. Today recorded as Present.', 'success');\n    }\n\n    // ── ATTENDANCE: build May 2026 calendar ──\n    (function buildCal(){\n      const grid = document.getElementById('calGrid'); if (!grid) return;\n      const dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\n      dows.forEach(d => { const c = document.createElement('div'); c.className='cal-dow'; c.textContent=d; grid.appendChild(c); });\n      // May 2026: 1st is Friday. We use Mon-start grid.\n      // Mon=0..Sun=6 → 1 May 2026 is Friday → index 4\n      const offset = 4;\n      const days = 31;\n      // States: P=present, L=late, A=leave, H=holiday, W=weekend, F=future, T=today\n      const today = 20;\n      const states = {\n        1:'W',2:'W',  // Fri-Sat (Sat is working half-day but let's mark Sun only as weekend; Fri working)\n        3:'W', // Sun\n        4:'P',5:'P',6:'P',7:'L',8:'P',9:'P',10:'W',\n        11:'P',12:'P',13:'P',14:'P',15:'A',16:'P',17:'W',\n        18:'L',19:'P',20:'T',21:'F',22:'F',23:'F',24:'W',\n        25:'F',26:'F',27:'F',28:'F',29:'F',30:'F',31:'W'\n      };\n      // override: 1 May is Labour Day → holiday\n      states[1] = 'H';\n      const labelMap = { P:'Present', L:'Late', A:'Leave', H:'Labour Day', W:'', F:'', T:'In progress' };\n      for (let i = 0; i < offset; i++) {\n        const c = document.createElement('div'); c.className = 'cal-cell empty'; grid.appendChild(c);\n      }\n      for (let d = 1; d <= days; d++) {\n        const c = document.createElement('div');\n        const s = states[d] || 'F';\n        let cls = 'cal-cell';\n        if (s === 'P') cls += ' present';\n        else if (s === 'L') cls += ' late';\n        else if (s === 'A') cls += ' leave';\n        else if (s === 'H') cls += ' holiday';\n        else if (s === 'W') cls += ' weekend';\n        else if (s === 'T') cls += ' present today';\n        c.className = cls;\n        c.innerHTML = `<div class=\"d\">${d}<\/div><div class=\"t\">${labelMap[s] || ''}<\/div>`;\n        grid.appendChild(c);\n      }\n    })();\n  <\/script>\n<\/body>\n<\/html>\n","Admin Portal.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Admin Portal — Sharda Public School<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap\" rel=\"stylesheet\" />\n  <style>\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n    :root {\n      --forest: #1b4d30; --forest-mid: #286640; --forest-light: #3d8f5a;\n      --forest-pale: #e8f4ec;\n      --navy: #162840; --navy-mid: #1e3a5c;\n      --amber: #c8831a; --amber-light: #e8a030; --amber-pale: #fdf5e8;\n      --sky: #2f7ea8; --sky-light: #e8f4fb;\n      --red: #c0392b; --red-pale: #fdf0ef;\n      --purple: #6b21a8; --purple-pale: #f3eafd;\n      --warm: #faf9f6; --snow: #f5f8fa; --cream: #f2ede4;\n      --border: #dce8e0; --text: #1a2418; --muted: #52645a;\n      --sidebar-w: 268px;\n      --admin-accent: #4a1d52;\n      --admin-accent-light: #6b21a8;\n    }\n    html { font-size: 16px; }\n    body { font-family: 'DM Sans', sans-serif; background: var(--snow); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }\n\n    /* SIDEBAR */\n    .sidebar { width: var(--sidebar-w); background: var(--admin-accent); min-height: 100vh; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100; overflow-y: auto; }\n    .sidebar-logo { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; text-decoration: none; }\n    .sidebar-logo img { height: 38px; filter: brightness(0) invert(1); }\n    .sidebar-logo-text .name { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; color: #fff; }\n    .sidebar-logo-text .sub { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; letter-spacing: 0.1em; }\n    .sidebar-user { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 12px; }\n    .user-av { width: 42px; height: 42px; border-radius: 50%; background: var(--amber); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0; }\n    .user-info .name { font-size: 13.5px; font-weight: 600; color: #fff; }\n    .user-info .role { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }\n    .user-badge { margin-left: auto; background: var(--amber); color: #fff; font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.08em; }\n\n    .sidebar-nav { padding: 14px 0; flex: 1; }\n    .nav-section { padding: 12px 20px 4px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.25); }\n    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; cursor: pointer; color: rgba(255,255,255,0.6); font-size: 13.5px; font-weight: 500; transition: all 0.2s; border-left: 3px solid transparent; text-decoration: none; }\n    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }\n    .nav-item.active { color: #fff; background: rgba(255,255,255,0.08); border-left-color: var(--amber-light); }\n    .nav-item .ni-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }\n    .ni-badge { margin-left: auto; background: var(--amber); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }\n    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.07); }\n    .sidebar-footer a { color: rgba(255,255,255,0.4); font-size: 12.5px; text-decoration: none; transition: color 0.2s; }\n    .sidebar-footer a:hover { color: rgba(255,255,255,0.8); }\n\n    /* MAIN */\n    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }\n    .topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 0 36px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }\n    .topbar-title { font-size: 17px; font-weight: 600; color: var(--navy); }\n    .topbar-right { display: flex; align-items: center; gap: 14px; }\n    .tb-btn { padding: 8px 18px; border-radius: 3px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; }\n    .tb-btn.primary { background: var(--admin-accent); color: #fff; }\n    .tb-btn.primary:hover { background: var(--admin-accent-light); }\n    .tb-btn.amber { background: var(--amber); color: #fff; }\n    .tb-btn.amber:hover { background: var(--amber-light); }\n    .tb-btn.ghost { background: none; border: 1.5px solid var(--border); color: var(--navy); }\n    .tb-btn.ghost:hover { border-color: var(--navy); }\n    .tb-date { font-size: 12px; color: var(--muted); }\n    .tb-notif { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; position: relative; }\n    .tb-notif .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--red); border-radius: 50%; border: 1.5px solid #fff; }\n\n    .content { padding: 32px 36px; flex: 1; }\n    .panel { display: none; }\n    .panel.active { display: block; }\n\n    .sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }\n    .sec-head h3 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: var(--navy); }\n\n    /* DASHBOARD CARDS */\n    .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }\n    .dash-card { background: #fff; padding: 22px 24px; border-radius: 4px; border: 1px solid var(--border); position: relative; overflow: hidden; }\n    .dash-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }\n    .dash-card.purple::before { background: var(--admin-accent-light); }\n    .dash-card.amber::before  { background: var(--amber); }\n    .dash-card.green::before  { background: var(--forest-mid); }\n    .dash-card.red::before    { background: var(--red); }\n    .dc-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }\n    .dc-val { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 700; line-height: 1; color: var(--navy); }\n    .dc-val .cur { font-size: 18px; color: var(--amber); margin-right: 4px; }\n    .dc-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }\n    .dc-icon { position: absolute; bottom: 14px; right: 18px; font-size: 28px; opacity: 0.08; }\n\n    /* HEADER BANNERS */\n    .panel-header {\n      background: linear-gradient(135deg, var(--admin-accent) 0%, var(--admin-accent-light) 100%);\n      border-radius: 6px; padding: 32px 36px; margin-bottom: 24px; position: relative; overflow: hidden;\n    }\n    .panel-header::before { content: ''; position: absolute; top: -60px; right: -40px; width: 240px; height: 240px; border-radius: 50%; background: rgba(232,160,48,0.1); }\n    .panel-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 30px; color: #fff; margin-bottom: 6px; position: relative; }\n    .panel-header p { font-size: 14px; color: rgba(255,255,255,0.7); max-width: 60ch; position: relative; }\n\n    /* FILTER BAR */\n    .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; padding: 16px 20px; background: #fff; border: 1px solid var(--border); border-radius: 4px; align-items: center; }\n    .filter-bar label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 4px; }\n    .filter-bar select, .filter-bar input {\n      padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 3px;\n      font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);\n      background: #fff; outline: none;\n    }\n    .filter-bar select:focus, .filter-bar input:focus { border-color: var(--admin-accent); }\n    .filter-bar .spacer { flex: 1; }\n    .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }\n    .pill.ok { background: var(--forest-pale); color: var(--forest-mid); }\n    .pill.late { background: #fef3e0; color: var(--amber); }\n    .pill.leave { background: var(--red-pale); color: var(--red); }\n    .pill.pending { background: var(--snow); color: var(--muted); }\n    .pill.review { background: var(--amber-pale); color: var(--amber); }\n    .pill.processed { background: var(--forest-pale); color: var(--forest-mid); }\n\n    /* TABLE — generic */\n    .data-table { width: 100%; background: #fff; border: 1px solid var(--border); bo   border: 1px solid var(--border); cursor: pointer; background: #fff; color: var(--navy);\n      transition: all 0.15s;\n    }\n    .content-card .actions button:hover { border-color: var(--admin-accent); color: var(--admin-accent); }\n    .content-card .actions button.primary { background: var(--admin-accent); color: #fff; border-color: var(--admin-accent); }\n    .content-card .actions button.primary:hover { background: var(--admin-accent-light); border-color: var(--admin-accent-light); color: #fff; }\n\n    /* SYSTEM / PERMISSIONS */\n    .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }\n    .role-card {\n      background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 20px 24px;\n    }\n    .role-card .top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }\n    .role-card .badge {\n      width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center;\n      font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 700; color: #fff;\n    }\n    .role-card .badge.admin { background: var(--admin-accent); }\n    .role-card .badge.principal { background: var(--navy); }\n    .role-card .badge.teacher { background: var(--forest); }\n    .role-card .badge.parent { background: var(--amber); }\n    .role-card .badge.student { background: var(--sky); }\n    .role-card .badge.accounts { background: var(--red); }\n    .role-card .info .nm { font-size: 14.5px; font-weight: 600; color: var(--navy); }\n    .role-card .info .ct { font-size: 11.5px; color: var(--muted); margin-top: 2px; }\n    .role-card .perms { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }\n    .perm-pill { font-size: 10.5px; padding: 2px 8px; border-radius: 10px; background: var(--snow); color: var(--text); }\n    .perm-pill.full { background: var(--admin-accent); color: #fff; font-weight: 600; }\n    .role-card .row-actions { margin-top: 14px; } Allowance<\/span><span class=\"v\">₹ 4,000<\/span><\/div>\n            <div class=\"pdg-line\"><span class=\"k\">Special Allowance<\/span><span class=\"v\">₹ 8,200<\/span><\/div>\n            <div class=\"pdg-line\"><span class=\"k\">Class-teacher Allow.<\/span><span class=\"v\">₹ 2,000<\/span><\/div>\n            <div class=\"pdg-line\"><span class=\"k\">Performance Bonus<\/span><span class=\"v\">₹ 1,500<\/span><\/div>\n            <div class=\"pdg-line total\"><span class=\"k\">Gross<\/span><span class=\"v\" id=\"m-gross\">₹ 68,900<\/span><\/div>\n          <\/div>\n          <div class=\"pdg-col\">\n            <h5>Deductions<\/h5>\n            <div class=\"pdg-line\"><span class=\"k\">Provident Fund (12%)<\/span><span class=\"v\">₹ 4,560<\/span><\/div>\n            <div class=\"pdg-line\"><span class=\"k\">Professional Tax<\/span><span class=\"v\">₹ 200<\/span><\/div>\n            <div class=\"pdg-line\"><span class=\"k\">TDS<\/span><span class=\"v\">₹ 1,300<\/span><\/div>\n            <div class=\"pdg-line\"><span class=\"k\">Loss of pay<\/span><span class=\"v\">₹ 0<\/span><\/div>\n            <div class=\"pdg-line\"><span class=\"k\">Health insurance<\/span><span class=\"v\">₹ 0<\/span><\/div>\n            <div class=\"pdg-line\"><span class=\"k\">&nbsp;<\/span><span class=\"v\">&nbsp;<\/span><\/div>\n            <div class=\"pdg-line total deduct\"><span class=\"k\">Total Deductions<\/span><span class=\"v\" id=\"m-ded\">₹ 6,060<\/span><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"net-card\">\n          <div class=\"k\">Net Salary to Credit<\/div>\n          <div class=\"v\"><span class=\"cur\">₹<\/span><span id=\"m-net\">62,840<\/span><\/div>\n        <\/div>\n\n        <div class=\"modal-actions\">\n          <button class=\"cancel\" onclick=\"closeModal()\">Close<\/button>\n          <button class=\"credit\" onclick=\"creditFromModal()\">⚡ Credit Salary Now<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n\n  <script>\n    function showPanel(id, el) {\n      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));\n      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));\n      const panel = document.getElementById('panel-' + id);\n      if (panel) panel.classList.add('active');\n      if (el) el.classList.add('active');\n      const titles = {\n        dashboard: 'Dashboard', approvals: 'Approvals Queue',\n        admissions: 'Admissions Pipeline', students: 'Student Records',\n        academics: 'Academics & Results',\n        attendance: 'Attendance Review', leaves: 'Leave Requests',\n        salary: 'Salary Processing', history: 'Payroll History',\n        staff: 'Staff Directory',\n        fees: 'Fees & Collections',\n        communications: 'Communications', content: 'Website & Content',\n        permissions: 'Roles & Permissions', audit: 'Audit Log'\n      };\n      document.getElementById('panel-title').textContent = titles[id] || id;\n    }\n\n    function showToast(msg, type='info') {\n      const t = document.getElementById('toast');\n      t.textContent = msg;\n      t.className = 'toast ' + type + ' show';\n      clearTimeout(window._toastTimer);\n      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3200);\n    }\n\n    // ── ATTENDANCE ACTIONS ──\n    function approveAtt(btn) {\n      const row = btn.closest('tr');\n      row.querySelector('td:nth-last-child(2) .pill').className = 'pill ok';\n      row.querySelector('td:nth-last-child(2) .pill').textContent = 'Approved';\n      btn.parentElement.innerHTML = '<button class=\"ra-view\">View log<\/button>';\n      showToast('✅ Attendance approved.', 'success');\n    }\n    function flagStaff(btn) {\n      showToast('⚠ Staff flagged for HR follow-up.', 'info');\n    }\n    function lockMonth() {\n      if (!confirm('Lock May 2026 attendance? Teachers will no longer be able to request corrections, and payroll can be processed.')) return;\n      showToast('🔒 May attendance locked. Payroll cycle is now open.', 'success');\n    }\n    function openCorrection(name) {\n      showToast('Opening attendance correction for ' + name + '...', 'info');\n    }\n\n    // ── LEAVE ACTIONS ──\n    function approveLeave(btn) {\n      const card = btn.closest('.leave-card');\n      const pill = card.querySelector('.pill');\n      pill.className = 'pill ok'; pill.textContent = 'Approved · just now';\n      card.querySelector('.row-actions').innerHTML = '<button class=\"ra-view\">View details<\/button>';\n      showToast('✅ Leave approved. Teacher notified.', 'success');\n    }\n    function rejectLeave(btn) {\n      const card = btn.closest('.leave-card');\n      const pill = card.querySelector('.pill');\n      pill.className = 'pill leave'; pill.textContent = 'Rejected';\n      card.querySelector('.row-actions').innerHTML = '<button class=\"ra-view\">View details<\/button>';\n      showToast('Leave rejected. Teacher notified.', 'info');\n    }\n\n    // ── SALARY ──\n    function filterSal(v) {\n      document.querySelectorAll('#salTableBody tr').forEach(r => {\n        if (v === 'all') r.style.display = '';\n        else r.style.display = (r.dataset.status === v) ? '' : 'none';\n      });\n    }\n    function toggleAll(master, cls) {\n      document.querySelectorAll('.' + cls).forEach(c => c.checked = master.checked);\n      if (cls === 'salck') updateBulk();\n    }\n    function updateBulk() {\n      const checked = document.querySelectorAll('#salTableBody .salck:checked');\n      const bar = document.getElementById('bulkBar');\n      document.getElementById('bulkCount').textContent = checked.length;\n      bar.style.display = checked.length > 0 ? 'flex' : 'none';\n    }\n    function clearSelection() {\n      document.querySelectorAll('.salck').forEach(c => c.checked = false);\n      updateBulk();\n    }\n    function bulkCredit() {\n      const checked = document.querySelectorAll('#salTableBody .salck:checked');\n      if (!confirm('Credit salaries for ' + checked.length + ' staff via NEFT batch?')) return;\n      let total = 0;\n      checked.forEach(c => {\n        const row = c.closest('tr');\n        if (row.dataset.status !== 'pending') return;\n        const netTxt = row.children[5].textContent.replace(/[^0-9]/g,'');\n        total += parseInt(netTxt, 10) || 0;\n        markCredited(row);\n      });\n      clearSelection();\n      showToast('⚡ Bulk credit complete · ₹' + total.toLocaleString('en-IN') + ' disbursed.', 'success');\n    }\n    function creditSal(btn, name) {\n      const row = btn.closest('tr');\n      if (!confirm('Credit salary for ' + name + ' via NEFT?')) return;\n      markCredited(row);\n      showToast('✅ Salary credited to ' + name + '. NEFT reference SPS/2605/' + Math.floor(1000+Math.random()*9000), 'success');\n    }\n    function markCredited(row) {\n      const pill = row.querySelector('td:nth-last-child(2) .pill');\n      pill.className = 'pill processed';\n      pill.textContent = '✓ Credited just now';\n      const act = row.querySelector('.row-actions');\n      act.innerHTML = '<button class=\"ra-view\" onclick=\"showToast(\\'Payslip downloaded\\',\\'success\\')\">PDF<\/button>';\n      row.dataset.status = 'processed';\n    }\n\n    // ── MODAL ──\n    let modalRowName = '';\n    function openPayslip(name, role, d) {\n      document.getElementById('m-name').textContent = name + ' · Payslip';\n      document.getElementById('m-role').textContent = role + ' · May 2026 cycle';\n      document.getElementById('m-days').textContent = d.days;\n      document.getElementById('m-att').textContent = d.att;\n      document.getElementById('m-gross').textContent = '₹ ' + d.gross;\n      document.getElementById('m-ded').textContent = '₹ ' + d.ded;\n      document.getElementById('m-net').textContent = d.net;\n      modalRowName = name;\n      document.getElementById('modal').classList.add('show');\n    }\n    function closeModal() { document.getElementById('modal').classList.remove('show'); }\n    function creditFromModal() {\n      // Find the matching row by name text and credit it\n      document.querySelectorAll('#salTableBody tr').forEach(r => {\n        if (r.querySelector('.nm') && r.querySelector('.nm').textContent.trim() === modalRowName && r.dataset.status === 'pending') {\n          markCredited(r);\n        }\n      });\n      closeModal();\n      showToast('✅ Salary credited to ' + modalRowName + '. Teacher notified.', 'success');\n    }\n\n    // ── APPROVALS QUEUE ──\n    function filterQueue(tab, cat) {\n      document.querySelectorAll('.qtab').forEach(t => t.classList.remove('active'));\n      tab.classList.add('active');\n      document.querySelectorAll('#queueList .q-card').forEach(card => {\n        if (cat === 'all') { card.style.display = ''; return; }\n        card.style.display = card.dataset.cat.includes(cat) ? '' : 'none';\n      });\n    }\n    function approveQ(btn, msg) {\n      const card = btn.closest('.q-card');\n      card.style.opacity = '0.5';\n      card.querySelector('.row-actions').innerHTML = '<button class=\"ra-view\" disabled>✓ Approved<\/button>';\n      showToast('✅ ' + msg, 'success');\n    }\n    function rejectQ(btn) {\n      const card = btn.closest('.q-card');\n      card.style.opacity = '0.4';\n      card.querySelector('.row-actions').innerHTML = '<button class=\"ra-view\" disabled>Rejected<\/button>';\n      showToast('Request rejected. Initiator notified.', 'info');\n    }\n\n    // ── ADMISSIONS ──\n    function approveAdm(btn, name) {\n      const row = btn.closest('tr');\n      const pill = row.querySelector('.pill');\n      pill.className = 'pill ok'; pill.textContent = 'Offer issued';\n      btn.parentElement.innerHTML = '<button class=\"ra-view\">File<\/button>';\n      showToast('✅ Admission offer issued to ' + name + '. Family being notified.', 'success');\n    }\n    function declineAdm(btn) {\n      const row = btn.closest('tr');\n      const pill = row.querySelector('.pill');\n      pill.className = 'pill leave'; pill.textContent = 'Declined';\n      btn.parentElement.innerHTML = '<button class=\"ra-view\">File<\/button>';\n      showToast('Application declined. Family informed politely.', 'info');\n    }\n\n    // ── STUDENTS ──\n    function approveStu(btn, msg) {\n      const row = btn.closest('tr');\n      row.style.background = 'var(--forest-pale)';\n      btn.parentElement.innerHTML = '<button class=\"ra-view\">✓ Done<\/button>';\n      showToast('✅ ' + msg, 'success');\n    }\n\n    // ── ACADEMICS / RESULTS ──\n    function publishResults(label) {\n      if (!confirm('Publish ' + label + ' results to all parents and on the website? This action is logged and cannot be undone silently.')) return;\n      showToast('✅ ' + label + ' published. 1,284 parents notified via SMS, email & app.', 'success');\n    }\n\n    // ── COMMUNICATIONS ──\n    function sendBroadcast(btn) {\n      if (!confirm('Send broadcast now? You cannot recall once sent.')) return;\n      btn.textContent = '✓ Sent · 1,247 recipients';\n      btn.style.background = 'var(--forest-light)';\n      btn.disabled = true;\n      showToast('📣 Broadcast sent. Delivery report will be available in 5 minutes.', 'success');\n    }\n  <\/script>\n<\/body>\n<\/html>\n","Feature Documentation.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Feature Documentation — Sharda Public School Website<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\" />\n  <style>\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n    :root {\n      --forest: #1b4d30; --forest-mid: #286640; --forest-pale: #e8f4ec;\n      --navy: #162840; --navy-mid: #1e3a5c;\n      --amber: #c8831a; --amber-light: #e8a030; --amber-pale: #fdf5e8;\n      --sky: #2f7ea8; --sky-pale: #e8f4fb;\n      --red: #c0392b; --red-pale: #fdf0ef;\n      --purple: #6b21a8; --purple-pale: #f3eafd;\n      --warm: #faf9f6; --snow: #f5f8fa; --cream: #f2ede4;\n      --border: #dce8e0; --text: #1a2418; --muted: #52645a;\n      --sidebar-w: 280px;\n    }\n    html { font-size: 16px; scroll-behavior: smooth; }\n    body { font-family: 'DM Sans', sans-serif; background: var(--warm); color: var(--text); display: flex; min-height: 100vh; }\n\n    /* SIDEBAR */\n    .sidebar {\n      width: var(--sidebar-w); background: var(--navy); position: fixed;\n      top: 0; left: 0; height: 100vh; overflow-y: auto;\n      display: flex; flex-direction: column;\n    }\n    .sb-top {\n      padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.07);\n    }\n    .sb-top a { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 20px; }\n    .sb-top img { height: 36px; filter: brightness(0) invert(1); }\n    .sb-top .title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: #fff; line-height: 1.2; }\n    .sb-top .subtitle { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; margin-top: 4px; }\n    .sb-meta { display: flex; gap: 8px; flex-wrap: wrap; }\n    .sb-meta span {\n      font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 700; letter-spacing: 0.06em;\n    }\n    .sb-meta .v { background: rgba(27,77,48,0.4); color: #a8d8b8; }\n    .sb-meta .d { background: rgba(200,131,26,0.3); color: var(--amber-light); }\n\n    .sb-nav { padding: 12px 0; flex: 1; }\n    .sb-section { padding: 14px 20px 4px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.25); }\n    .sb-link {\n      display: flex; align-items: center; gap: 10px; padding: 9px 20px;\n      color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500;\n      text-decoration: none; transition: all 0.2s;\n      border-left: 3px solid transparent;\n    }\n    .sb-link:hover { color: #fff; background: rgba(255,255,255,0.05); }\n    .sb-link.new::after { content: 'NEW'; font-size: 9px; font-weight: 800; letter-spacing: 0.1em; background: var(--forest-mid); color: #fff; padding: 2px 7px; border-radius: 10px; margin-left: auto; }\n    .sb-link.exists::after { content: 'LIVE'; font-size: 9px; font-weight: 800; letter-spacing: 0.1em; background: var(--amber); color: #fff; padding: 2px 7px; border-radius: 10px; margin-left: auto; }\n    .sb-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.07); }\n    .sb-footer a { color: rgba(255,255,255,0.4); font-size: 12.5px; text-decoration: none; transition: color 0.2s; }\n    .sb-footer a:hover { color: rgba(255,255,255,0.8); }\n\n    /* MAIN */\n    .main { margin-left: var(--sidebar-w); flex: 1; }\n\n    /* HERO */\n    .doc-hero {\n      background: linear-gradient(135deg, var(--navy) 0%, var(--forest) 100%);\n      padding: 64px 80px 56px; position: relative; overflow: hidden;\n    }\n    .doc-hero::after {\n      content: ''; position: absolute; inset: 0;\n      background: url(\"data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E\");\n    }\n    .doc-hero-inner { position: relative; z-index: 1; }\n    .doc-hero .eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; color: var(--amber-light); margin-bottom: 12px; }\n    .doc-hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 700; color: #fff; line-height: 1.1; margin-bottom: 14px; }\n    .doc-hero h1 em { font-style: italic; color: #a8d8b8; }\n    .doc-hero p { font-size: 15px; color: rgba(255,255,255,0.65); max-width: 580px; line-height: 1.7; }\n    .hero-chips { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }\n    .chip {\n      padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700;\n      letter-spacing: 0.06em;\n    }\n    .chip.green { background: rgba(27,77,48,0.5); color: #a8d8b8; border: 1px solid rgba(168,216,184,0.3); }\n    .chip.amber { background: rgba(200,131,26,0.3); color: var(--amber-light); border: 1px solid rgba(232,160,48,0.3); }\n    .chip.sky { background: rgba(47,126,168,0.3); color: #7ec8e8; border: 1px solid rgba(126,200,232,0.3); }\n\n    /* CONTENT */\n    .doc-content { padding: 0 80px 80px; }\n\n    /* Summary cards */\n    .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); margin: 40px 0; }\n    .sum-card {\n      background: #fff; padding: 24px 28px;\n    }\n    .sum-card .num { font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 700; color: var(--navy); line-height: 1; }\n    .sum-card .lbl { font-size: 12px; color: var(--muted); margin-top: 6px; }\n\n    /* Feature sections */\n    .feat-section { margin-bottom: 60px; }\n    .feat-section-head {\n      display: flex; align-items: center; gap: 16px;\n      padding: 24px 32px;\n      border-radius: 4px 4px 0 0;\n      margin-bottom: 0;\n    }\n    .feat-section-head.new-feat { background: var(--forest); }\n    .feat-section-head.exist-feat { background: var(--navy); }\n    .feat-section-head .fsh-icon { font-size: 28px; }\n    .feat-section-head .fsh-text h2 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: #fff; }\n    .feat-section-head .fsh-text p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 2px; }\n    .feat-section-head .fsh-badge {\n      margin-left: auto; padding: 6px 16px; border-radius: 20px;\n      font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;\n    }\n    .fsh-badge.new-b { background: rgba(168,216,184,0.2); color: #a8d8b8; border: 1px solid rgba(168,216,184,0.3); }\n    .fsh-badge.live-b { background: rgba(232,160,48,0.2); color: var(--amber-light); border: 1px solid rgba(232,160,48,0.3); }\n\n    .feat-body {\n      background: #fff; border: 1px solid var(--border); border-top: none;\n      border-radius: 0 0 4px 4px; overflow: hidden;\n    }\n\n    /* Feature row */\n    .feat-row {\n      display: grid; grid-template-columns: 260px 1fr;\n      border-bottom: 1px solid var(--border);\n    }\n    .feat-row:last-child { border-bottom: none; }\n    .feat-col-label {\n      padding: 24px 24px; background: var(--snow);\n      border-right: 1px solid var(--border);\n      display: flex; flex-direction: column; gap: 6px;\n    }\n    .feat-col-label h4 { font-size: 13px; font-weight: 700; color: var(--navy); letter-spacing: 0.02em; }\n    .feat-col-label .tag {\n      display: inline-block; padding: 3px 10px; border-radius: 20px;\n      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;\n    }\n    .tag.new { background: var(--forest-pale); color: var(--forest-mid); }\n    .tag.live { background: var(--amber-pale); color: var(--amber); }\n    .tag.planned { background: var(--sky-pale); color: var(--sky); }\n    .tag.portal { background: var(--purple-pale); color: var(--purple); }\n    .feat-col-content { padding: 24px 28px; }\n    .feat-col-content p { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }\n    .feat-col-content p:last-child { margin-bottom: 0; }\n\n    /* Sub-feature list */\n    .sub-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }\n    .sub-item {\n      display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;\n      background: var(--snow); border-radius: 3px; border-left: 3px solid var(--border);\n    }\n    .sub-item.done { border-left-color: var(--forest-mid); }\n    .sub-item.new-si { border-left-color: var(--amber); }\n    .sub-item.plan { border-left-color: var(--sky); }\n    .sub-icon { font-size: 16px; flex-shrink: 0; }\n    .sub-text h5 { font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 2px; }\n    .sub-text p { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0; }\n\n    /* Tech spec table */\n    .spec-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }\n    .spec-table th { background: var(--snow); text-align: left; padding: 8px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }\n    .spec-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }\n    .spec-table tr:last-child td { border-bottom: none; }\n    .spec-table code { font-family: 'DM Mono', monospace; font-size: 12px; background: var(--snow); padding: 2px 8px; border-radius: 3px; color: var(--forest); }\n    .spec-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }\n    .spec-status.done { color: var(--forest-mid); }\n    .spec-status.new { color: var(--amber); }\n    .spec-status.plan { color: var(--sky); }\n\n    /* Roadmap */\n    .roadmap { margin-top: 60px; }\n    .roadmap h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; color: var(--navy); margin-bottom: 28px; }\n    .roadmap-timeline { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--border); padding-left: 32px; margin-left: 12px; }\n    .rm-item { position: relative; padding-bottom: 36px; }\n    .rm-item:last-child { padding-bottom: 0; }\n    .rm-dot {\n      position: absolute; left: -41px; top: 4px;\n      width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff;\n      box-shadow: 0 0 0 2px var(--border);\n    }\n    .rm-dot.done { background: var(--forest-mid); box-shadow: 0 0 0 2px var(--forest-pale); }\n    .rm-dot.active { background: var(--amber); box-shadow: 0 0 0 2px var(--amber-pale); }\n    .rm-dot.plan { background: var(--border); }\n    .rm-phase { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }\n    .rm-item h4 { font-size: 16px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }\n    .rm-item p { font-size: 13.5px; color: var(--muted); line-height: 1.6; }\n    .rm-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }\n    .rm-tag { font-size: 11px; padding: 3px 12px; border-radius: 20px; font-weight: 600; }\n    .rm-tag.g { background: var(--forest-pale); color: var(--forest-mid); }\n    .rm-tag.a { background: var(--amber-pale); color: var(--amber); }\n    .rm-tag.s { background: var(--sky-pale); color: var(--sky); }\n    .rm-tag.p { background: var(--purple-pale); color: var(--purple); }\n  <\/style>\n<\/head>\n<body>\n\n<!-- SIDEBAR -->\n<aside class=\"sidebar\">\n  <div class=\"sb-top\">\n    <a href=\"index.html\">\n      <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHAAAABwCAYAAADG4PRLAAAQAElEQVR4AexcCWBV1bVd9w2ZX+aRhAyQkDAkEMI8yCyDICBi0So4Yv3V3+nbarX9Vvs72Fqt/qr1F2xtsVULyCiDzKAg80wgZCQDmaeXOS9/7RMufQxaXiDRh+9yzz3jPefcvc7eZ+99XjDYbLY2m80VbDbnpIEBrsupKeAC0KnhA1wAugB0cgo4+fRdHOgC0Mkp4OTTd3GgC0Anp4CTT7+DHOjkX30TTd8FoJOD6QLQBaCTU8DJp+/iwK8CgBonIYGRo7cLQEcp1hnt29ipBEaO3i4AHaXYV6y9C8CvGCCOTscFoKMU+4q171oAv2IffzNMxwWgk6PoAtAFoJNTwMmn7+JAF4BOTgEnn76LA10AOjkFnHz6Lg50AdhBCjjgfe/gCF+L17qGA68GVge9718LVBz4yM4FUAfucrCkXA/6ZCWvp13xNVOg8wD8d4DooOrtJC9pCdc8fVfDzgNQALGnrwAjQcr0Oj2Wck0eUukKjlCgcwDUsdABkhlJWoKk7YOUSZAyPZa0fdD7kzL7tOS/5qFzAPw8IHRiXw2ENr50tfIvekev+xrHBpKt6z//8waVcgmXz0gv08WsAC3h8nZfw7yhq+nQRk6rq29AWUUV2vjPMZoLkl09Y8dm2NWtO0eEfs5XCPkLzpfiH//cgH+u2ITyimpCKKWf84JerDBTD72kPRaOvBjai+yeX4tklwIoEFRV1uIfSzdg/4GTKC4ug5T9W0oLxuTcf7WTtySoin8Vfw1TXQqg0DcuthseuX8W7p03Dd2jwgHFQYxw2SX46EGv
