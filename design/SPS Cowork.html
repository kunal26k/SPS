el=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap\" rel=\"stylesheet\" />\n  <style>\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n    :root {\n      --forest: #1b4d30; --forest-mid: #286640; --forest-light: #3d8f5a; --forest-pale: #e8f4ec;\n      --navy: #162840; --navy-mid: #1e3a5c; --navy-deep: #0e1e2e;\n      --amber: #c8831a; --amber-light: #e8a030; --amber-pale: #fdf5e8;\n      --sky: #2f7ea8; --sky-light: #e8f4fb;\n      --warm: #faf9f6; --snow: #f5f8fa; --cream: #f2ede4;\n      --text: #1a2418; --muted: #52645a; --border: #dce8e0;\n      --nav-h: 76px;\n    }\n    html { scroll-behavior: smooth; font-size: 16px; }\n    body { font-family: 'DM Sans', sans-serif; background: var(--warm); color: var(--text); overflow-x: hidden; }\n    a { color: inherit; }\n\n    /* NAV */\n    nav.site-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: var(--nav-h); display: flex; align-items: center; padding: 0 48px; background: rgba(22, 40, 64, 0.98); box-shadow: 0 2px 24px rgba(0,0,0,0.18); backdrop-filter: blur(12px); }\n    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; }\n    .nav-logo img { height: 46px; filter: brightness(0) invert(1); }\n    .nav-brand .name { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: #fff; display: block; line-height: 1; }\n    .nav-brand .motto { font-size: 9.5px; color: var(--amber-light); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 4px; display: block; }\n    .nav-center { flex: 1; display: flex; justify-content: center; }\n    .nav-links { display: flex; gap: 4px; list-style: none; }\n    .nav-links > li > a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; padding: 8px 14px; border-radius: 4px; transition: color 0.2s, background 0.2s; }\n    .nav-links > li > a:hover, .nav-links > li.active > a { color: #fff; background: rgba(255,255,255,0.1); }\n    .nav-right { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }\n    .nav-portal { color: rgba(255,255,255,0.7); font-size: 12.5px; text-decoration: none; padding: 7px 14px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; transition: all 0.2s; }\n    .nav-portal:hover { color: #fff; border-color: rgba(255,255,255,0.6); }\n    .nav-apply { background: var(--amber); color: #fff; padding: 9px 20px; border-radius: 4px; font-size: 13px; font-weight: 600; text-decoration: none; letter-spacing: 0.03em; transition: background 0.2s; }\n    .nav-apply:hover { background: var(--amber-light); }\n\n    /* HEADER */\n    .page-head { padding: calc(var(--nav-h) + 64px) 80px 64px; background: linear-gradient(135deg, var(--navy) 0%, var(--forest) 120%); color: #fff; position: relative; overflow: hidden; }\n    .page-head::before { content: \"\"; position: absolute; inset: 0; background-image: radial-gradient(circle at 20% 30%, rgba(232,160,48,0.12), transparent 40%), radial-gradient(circle at 80% 70%, rgba(61,143,90,0.18), transparent 50%); pointer-events: none; }\n    .page-head .crumb { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--amber-light); margin-bottom: 14px; position: relative; }\n    .head-tag { display: inline-block; padding: 6px 14px; border: 1px solid rgba(255,255,255,0.25); border-radius: 100px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 18px; position: relative; }\n    .page-head h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(48px, 6vw, 76px); font-weight: 600; line-height: 1.05; max-width: 900px; position: ); margin-bottom: 18px; }\n    .pg-card p { font-size: 14.5px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; }\n    .pg-checks { list-style: none; display: flex; flex-direction: column; gap: 8px; }\n    .pg-checks li { font-size: 13.5px; color: var(--text); padding-left: 22px; position: relative; }\n    .pg-checks li::before { content: \"✓\"; position: absolute; left: 0; color: var(--forest-light); font-weight: 700; }\n\n    /* TEACHING PHILOSOPHY */\n    .philo-section { background: var(--warm); }\n    .philo-frame {\n      background: linear-gradient(135deg, var(--cream) 0%, #fff 100%);\n      border: 1px solid var(--border); border-radius: 4px;\n      padding: 48px 52px; margin-bottom: 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center;\n    }\n    .philo-frame .lbl { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--forest); margin-bottom: 12px; font-weight: 700; }\n    .philo-frame h3 { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 600; color: var(--navy); line-height: 1.1; margin-bottom: 16px; }\n    .philo-frame p { font-size: 15px; color: var(--muted); line-height: 1.8; }\n    .philo-diagram { background: var(--navy); color: #fff; padding: 36px 32px; border-radius: 3px; }\n    .philo-diagram .core { font-family: 'Cormorant Garamond', serif; font-size: 30px; color: var(--amber-light); text-align: center; padding: 18px 0; border: 1px dashed rgba(232,160,48,0.5); border-radius: 3px; margin-bottom: 18px; }\n    .philo-diagram .ring { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n    .philo-diagram .ring div { padding: 12px 14px; background: rgba(255,255,255,0.05); border-radius: 3px; font-size: 12.5px; color: rgba(255,255,255,0.85); text-align: center; letter-spacing: 0.04em; }\n\n    .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); margin-bottom: 48px; }\n    .pillar-cell { background: #fff; p erif; font-size: 16px; color: var(--amber-light); font-weight: 700; }\n\n    /* FAQ */\n    .faq-section { background: var(--snow); }\n    .faq-list { max-width: 880px; margin: 0 auto; }\n    .faq-item { border-bottom: 1px solid var(--border); }\n    .faq-item summary { padding: 22px 0; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--navy); }\n    .faq-item summary::-webkit-details-marker { display: none; }\n    .faq-item summary::after { content: \"+\"; font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--amber); transition: transform 0.2s; }\n    .faq-item[open] summary::after { content: \"−\"; }\n    .faq-item p { padding: 0 0 22px; font-size: 14.5px; color: var(--muted); line-height: 1.8; max-width: 760px; }\n\n    /* CTA STRIP */\n    .cta-strip { background: var(--navy-deep); color: #fff; padding: 64px 80px; display: flex; justify-content: space-between; align-items: center; gap: 48px; }\n    .cta-strip h3 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 500; line-height: 1.2; max-width: 700px; }\n    .cta-strip h3 em { color: var(--amber-light); font-style: italic; }\n    .cta-strip a { background: var(--amber); color: #fff; padding: 16px 32px; border-radius: 3px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; transition: background 0.2s; flex-shrink: 0; }\n    .cta-strip a:hover { background: var(--amber-light); }\n\n    /* FOOTER */\n    footer { background: #0e1e2e; padding: 64px 80px 32px; }\n    .footer-top { display: grid; grid-template-columns: 2.5fr 1fr 1fr 1fr; gap: 48px; padding-bottom: 48px; border-bottom: 1px solid rgba(255,255,255,0.07); margin-bottom: 28px; }\n    .footer-brand img { height: 50px; filter: brightness(0) invert(1); margin-bottom: 16px; display: block; }\n    .footer-brand p How we teach<\/a>\n      <a href=\"#subjects\">Subjects &amp; streams<\/a>\n      <a href=\"#arts\">Music, sports &amp; arts<\/a>\n      <a href=\"#support\">Student support<\/a>\n      <a href=\"#results\">Results<\/a>\n      <a href=\"#signature\">Signature programs<\/a>\n      <a href=\"#international\">International faculty<\/a>\n      <a href=\"#events\">Upcoming events<\/a>\n      <a href=\"#faq\">FAQ<\/a>\n    <\/div>\n  <\/header>\n\n  <!-- ═══ PROGRAMS OVERVIEW ═══ -->\n  <section class=\"programs-section\" id=\"programs\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Programs at a Glance<\/div>\n        <h2 class=\"sec-title\">An education for every stage.<\/h2>\n        <p class=\"sec-intro\">From the first crayon-drawn sun in Nursery to the last viva-voce in Class XII, every stage at SPS is taught by specialists trained for that age — never as a junior version of the next.<\/p>\n      <\/div>\n    <\/div>\n    <div class=\"pg-grid\">\n      <div class=\"pg-card\">\n        <div class=\"pg-num\">01<\/div>\n        <h3>Primary Wing<\/h3>\n        <div class=\"grades\">Nursery – Class V<\/div>\n        <p>Play-led foundations in our Lower Campus, with smaller class sizes and a daily rhythm built around storytelling, music, movement and the outdoors.<\/p>\n        <ul class=\"pg-checks\">\n          <li>Activity-led NCF 2024 foundational stage<\/li>\n          <li>Bilingual classrooms (English &amp; Hindi)<\/li>\n          <li>Specialist art, music &amp; PE teachers from Class I<\/li>\n          <li>Daily forest walks and garden time<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"pg-card\">\n        <div class=\"pg-num\">02<\/div>\n        <h3>Secondary<\/h3>\n        <div class=\"grades\">Class VI – X<\/div>\n        <p>The curriculum becomes structured and exam-ready, but stays inquiry-led — projects, lab work and discussion remain the heart of each subject.<\/p>\n        <ul class=\"pg-checks\">\n          <li>Full CBSE curriculum, Class X board prep<\/li>\n          <li>1:20 teacher-student ratio<\/li>\n          <li>AI &amp; Robotics elective from Class VIII<\/li>\n          <li>Olympiad track for Maths, Science &amp; English<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"pg-card\">\n        <div class=\"pg-num\">03<\/div>\n        <h3>Senior Secondary<\/h3>\n        <div class=\"grades\">Class XI – XII<\/div>\n        <p>Three streams, structured college counselling, and a quiet seriousness about Class XII boards and entrance exams — without coaching-class culture.<\/p>\n        <ul class=\"pg-checks\">\n          <li>Science · Commerce · Humanities streams<\/li>\n          <li>JEE / NEET / CUET orientation built-in<\/li>\n          <li>One-on-one career counselling<\/li>\n          <li>University application support (India &amp; abroad)<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ TEACHING PHILOSOPHY ═══ -->\n  <section class=\"philo-section\" id=\"philosophy\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">How We Teach<\/div>\n        <h2 class=\"sec-title\">The SPS Learning Framework.<\/h2>\n        <p class=\"sec-intro\">Our pedagogy isn't an imported model with a marketing name. It's a quiet set of habits we have refined over twenty-four years — articulated here so parents, students and teachers can hold us to it.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"philo-frame\">\n      <div>\n        <div class=\"lbl\">Our Framework<\/div>\n        <h3>Understand. Explore. Express. Refine.<\/h3>\n        <p>Every unit at SPS — whether it is Class III on the water cycle or Class XII on integral calculus — moves through four deliberate stages. Children first <strong>understand<\/strong> the why, then <strong>explore<\/strong> through hands-on work, then <strong>express<\/strong> what they have learned in their own words, and finally <strong>refine<\/strong> through teacher feedback. Memorisation is the very last step — and only when it earns its place.<\/p>\n      <\/div>\n      <div class=\"philo-diagram\">\n        <div class=\"core\">Concept &gt; Recall<\/div>\n        <div class=\"ring\">\n          <div>1 · Understand<\/div>\n          <div>2 · Explore<\/div>\n          <div>3 · Express<\/div>\n          <div>4 · Refine<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"pillars\">\n      <div class=\"pillar-cell\">\n        <div class=\"num\">I<\/div>\n        <h4>Inquiry Before Answer<\/h4>\n        <p>Lessons begin with a question, not a definition. Our teachers are trained to wait — sometimes uncomfortably long — for students to reach for their own hypothesis before any explanation arrives.<\/p>\n      <\/div>\n      <div class=\"pillar-cell\">\n        <div class=\"num\">II<\/div>\n        <h4>Concept Before Rote<\/h4>\n        <p>A child who understands <em>why<\/em> hydrogen and oxygen bond will not need to memorise that water is H₂O. We test understanding first; recall fluency follows from there, naturally and durably.<\/p>\n      <\/div>\n      <div class=\"pillar-cell\">\n        <div class=\"num\">III<\/div>\n        <h4>Skill-First Orientation<\/h4>\n        <p>Every subject is taught as a craft. English is reading and writing, not just grammar. Mathematics is reasoning, not just procedure. History is source-handling. We grade how students think, not only what they reproduce.<\/p>\n      <\/div>\n      <div class=\"pillar-cell\">\n        <div class=\"num\">IV<\/div>\n        <h4>Mentor &amp; Student in Partnership<\/h4>\n        <p>From Class VI onwards, every student has a faculty mentor who tracks them academically and pastorally for two full years. The relationship is the foundation; the marks follow it.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"pull-quote\">\n      <div class=\"mark\">&ldquo;<\/div>\n      <div>\n        <blockquote>The first time a child says \"wait — I think I see why this works,\" everything else gets easier. My job is mostly to engineer that moment, then get out of the way.<\/blockquote>\n        <div class=\"attrib\">— Ms. Padmini Joshi · Head of Mathematics · 14 years at SPS<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"ncf-row\">\n      <div>\n        <h4>NCF 2024 &amp; NEP 2020, in our classrooms.<\/h4>\n        <div class=\"tag\">Policy in practice<\/div>\n      <\/div>\n      <p>The new framework's emphasis on competency-based learning, multilingualism and experiential pedagogy is not a poster on our staffroom wall — it is the structure of our weekly timetable. Foundational-stage children spend roughly half their day in play-based learning, as NCF 2024 prescribes; middle-school students sit for competency-based assessments alongside conventional tests; and our Class IX–XII students choose subjects across the three traditional streams without rigid silos, in keeping with NEP 2020's flexibility principle. Our internal teacher development calendar runs on these mandates; visiting CBSE inspectors are welcome, every term.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ SUBJECTS & CURRICULUM ═══ -->\n  <section class=\"subj-section\" id=\"subjects\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Subjects &amp; Curriculum<\/div>\n        <h2 class=\"sec-title\">What your child will study, year by year.<\/h2>\n        <p class=\"sec-intro\">A scannable map of every subject offered at SPS, mapped to the four CBSE stages. We update this each session in line with NCF 2024 guidance and CBSE circulars.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"subj-grid\">\n      <!-- PRIMARY -->\n      <div class=\"subj-card\">\n        <div class=\"level\">Foundational &amp; Preparatory<\/div>\n        <h3>Primary Wing<\/h3>\n        <div class=\"meta\">Nursery – Class V · Lower Campus<\/div>\n        <p>Nursery and KG follow a fully play-based foundational curriculum — songs, stories, motor games, gardening. From Class III, the day becomes a little more structured, but timetables still protect a long art-and-outdoor block every afternoon.<\/p>\n        <div class=\"subj-block\">\n          <div class=\"k\">Core Subjects<\/div>\n          <div class=\"subj-tags\">\n            <span>English<\/span><span>Hindi<\/span><span>Mathematics<\/span><span>Environmental Studies<\/span><span>General Knowledge<\/span>\n          <\/div>\n        <\/div>\n        <div class=\"subj-block\">\n          <div class=\"k\">Enrichment &amp; Specialist<\/div>\n          <div class=\"subj-tags\">\n            <span class=\"amber\">Music<\/span><span class=\"amber\">Visual Art<\/span><span class=\"amber\">Theatre<\/span><span class=\"forest\">PE &amp; Movement<\/span><span class=\"forest\">Library Hour<\/span><span class=\"forest\">Computer Literacy (III–V)<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- MIDDLE -->\n      <div class=\"subj-card\">\n        <div class=\"level\">Middle Stage<\/div>\n        <h3>Middle School<\/h3>\n        <div class=\"meta\">Class VI – VIII · Upper Campus<\/div>\n        <p>The full CBSE middle-school curriculum, taught with thematic, project-based units that cut across subjects every term — for example, \"Water\" connects Geography, Biology and a Hindi essay assignment in Class VII.<\/p>\n        <div class=\"subj-block\">\n          <div class=\"k\">CBSE Subjects<\/div>\n          <div class=\"subj-tags\">\n            <span>English<\/span><span>Hindi<\/span><span>Mathematics<\/span><span>Science<\/span><span>Social Science<\/span><span>Computer Applications<\/span>\n          <\/div>\n        <\/div>\n        <div class=\"subj-block\">\n          <div class=\"k\">Third Language (Class VI elective)<\/div>\n          <div class=\"subj-tags\">\n            <span class=\"forest\">Sanskrit<\/span><span class=\"forest\">French<\/span><span class=\"forest\">Kumaoni Studies<\/span>\n          <\/div>\n        <\/div>\n        <div class=\"subj-block\">\n          <div class=\"k\">Enrichment<\/div>\n          <div class=\"subj-tags\">\n            <span class=\"amber\">Art &amp; Design<\/span><span class=\"amber\">Music<\/span><span class=\"amber\">Theatre<\/span><span>AI &amp; Robotics (Class VIII)<\/span><span>Sports Specialisation<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- SECONDARY -->\n      <div class=\"subj-card\">\n        <div class=\"level\">Secondary Stage<\/div>\n        <h3>Secondary<\/h3>\n        <div class=\"meta\">Class IX – X · Board preparation begins<\/div>\n        <p>The full CBSE Secondary curriculum, taught with intent. Our 1:20 ratio means every student gets focused board-exam coaching <em>inside<\/em> the regular school day — no after-school dependency on outside tuition.<\/p>\n        <div class=\"subj-block\">\n          <div class=\"k\">Compulsory<\/div>\n          <div class=\"subj-tags\">\n            <span>English (Language &amp; Literature)<\/span><span>Hindi<\/span><span>Mathematics (Standard / Basic)<\/span><span>Science<\/span><span>Social Science<\/span>\n          <\/div>\n        <\/div>\n        <div class=\"subj-block\">\n          <div class=\"k\">Skill / Optional Subjects<\/div>\n          <div class=\"subj-tags\">\n            <span class=\"forest\">AI<\/span><span class=\"forest\">Information Technology<\/span><span class=\"forest\">Sanskrit<\/span><span class=\"forest\">French<\/span><span class=\"forest\">Physical Education<\/span>\n          <\/div>\n        <\/div>\n        <div class=\"subj-block\">\n          <div class=\"k\">Built into the Timetable<\/div>\n          <div class=\"subj-tags\">\n            <span>Pre-board cycles (Sept &amp; Dec)<\/span><span>Board-style Saturday papers<\/span><span>Concept-clinic mentor hours<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- SENIOR -->\n      <div class=\"subj-card\">\n        <div class=\"level\">Senior Secondary Stage<\/div>\n        <h3>Senior Secondary<\/h3>\n        <div class=\"meta\">Class XI – XII · Three streams, flexible electives<\/div>\n        <p>Students choose a stream at the end of Class X after a structured counselling cycle. Cross-stream electives (e.g., Mathematics in Humanities, Psychology in Science) are permitted where the timetable allows.<\/p>\n        <div class=\"subj-block\">\n          <div class=\"k\">All streams take<\/div>\n          <div class=\"subj-tags\">\n            <span>English Core<\/span><span class=\"forest\">Physical Education<\/span><span class=\"amber\">General Studies seminar (Friday)<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"streams\">\n      <div class=\"stream\">\n        <span class=\"ribbon sci\">Science Stream<\/span>\n        <h4>Science<\/h4>\n        <ul>\n          <li>Physics<\/li>\n          <li>Chemistry<\/li>\n          <li>Biology <em>or<\/em> Mathematics<\/li>\n          <li>Computer Science <em>or<\/em> Informatics Practices<\/li>\n          <li>Optional: Psychology, Physical Education<\/li>\n        <\/ul>\n        <div class=\"careers\">\n          <div class=\"ck\">Career paths<\/div>\n          Engineering &amp; technology (JEE), medicine and life-sciences (NEET), pure sciences, data science, design, defence services and increasingly, climate and Himalayan-ecology research.\n        <\/div>\n      <\/div>\n      <div class=\"stream\">\n        <span class=\"ribbon com\">Commerce Stream<\/span>\n        <h4>Commerce<\/h4>\n        <ul>\n          <li>Accountancy<\/li>\n          <li>Business Studies<\/li>\n          <li>Economics<\/li>\n          <li>Mathematics <em>or<\/em> Informatics Practices<\/li>\n          <li>Optional: Entrepreneurship, Physical Education<\/li>\n        <\/ul>\n        <div class=\"careers\">\n          <div class=\"ck\">Career paths<\/div>\n          Chartered accountancy, BBA &amp; B.Com programmes, finance and banking, economics honours at top DU colleges, entrepreneurship, hospitality management and CUET-led liberal arts at Ashoka, FLAME and beyond.\n        <\/div>\n      <\/div>\n      <div class=\"stream\">\n        <span class=\"ribbon hum\">Humanities Stream<\/span>\n        <h4>Humanities &amp; Arts<\/h4>\n        <ul>\n          <li>History<\/li>\n          <li>Geography<\/li>\n          <li>Political Science<\/li>\n          <li>Psychology <em>or<\/em> Sociology<\/li>\n          <li>Optional: Mathematics, Fine Arts, Economics<\/li>\n        <\/ul>\n        <div class=\"careers\">\n          <div class=\"ck\">Career paths<\/div>\n          Law (CLAT), civil services, journalism &amp; media, psychology, design, international relations, public policy, and humanities programmes at LSR, St. Stephen's, Ashoka, Edinburgh and beyond.\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ CO-CURRICULAR ═══ -->\n  <section class=\"arts-section\" id=\"arts\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Music · Sports · Arts<\/div>\n        <h2 class=\"sec-title\">Six afternoons a week of something else.<\/h2>\n        <p class=\"sec-intro\">Co-curricular hours are not optional add-ons at SPS — they are timetabled, taught by specialists, and graded on the report card. Every student picks a music programme, a sport, and one creative discipline each year.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"arts-grid\">\n      <div class=\"art-card amber\">\n        <div class=\"art-glyph\">♪<\/div>\n        <h4>Music<\/h4>\n        <div class=\"grades\">Nursery – Class XII<\/div>\n        <p>Vocal (Hindustani &amp; Western), keyboard, guitar, tabla and the school choir. Trinity College London grade examinations offered annually for guitar and keyboard, with on-campus assessment.<\/p>\n      <\/div>\n      <div class=\"art-card sky\">\n        <div class=\"art-glyph\">≈<\/div>\n        <h4>Swimming<\/h4>\n        <div class=\"grades\">Class III – XII (May–Sept)<\/div>\n        <p>A 25-metre, four-lane heated pool at the Upper Campus, with two certified coaches. Levels 1–4 progression from beginner to inter-school competitive squad. Mandatory water-safety module for Class III.<\/p>\n      <\/div>\n      <div class=\"art-card\">\n        <div class=\"art-glyph\">⚲<\/div>\n        <h4>Sports &amp; Athletics<\/h4>\n        <div class=\"grades\">All grades<\/div>\n        <p>Cricket, football, basketball, badminton, table tennis, athletics, and seasonal Himalayan sports — trekking, rock-climbing and skiing (Auli, winter). Inter-house tournaments every term.<\/p>\n      <\/div>\n      <div class=\"art-card amber\">\n        <div class=\"art-glyph\">𝝙<\/div>\n        <h4>Dance<\/h4>\n        <div class=\"grades\">Class I – XII<\/div>\n        <p>Classical (Kathak), Indian folk including Kumaoni Choliya, and contemporary. Annual production showcased at Founders' Day. Senior students may choose dance as a CBSE elective for Class XI–XII.<\/p>\n      <\/div>\n      <div class=\"art-card navy\">\n        <div class=\"art-glyph\">▣<\/div>\n        <h4>Theatre &amp; Acting<\/h4>\n        <div class=\"grades\">Class IV – XII<\/div>\n        <p>A weekly theatre studio led by a NSD-trained director. Two full-cast productions per year — one in English, one in Hindi — performed at the Almora town auditorium for the wider community.<\/p>\n      <\/div>\n      <div class=\"art-card sky\">\n        <div class=\"art-glyph\">▶<\/div>\n        <h4>Film-making<\/h4>\n        <div class=\"grades\">Class IX – XII<\/div>\n        <p>An elective in scriptwriting, cinematography, editing and sound design. Senior students produce a 15-minute documentary every year, often on Kumaon's vanishing crafts, screened at the SPS Hill Film Festival in February.<\/p>\n      <\/div>\n      <div class=\"art-card\">\n        <div class=\"art-glyph\">▦<\/div>\n        <h4>Visual Art &amp; Craft<\/h4>\n        <div class=\"grades\">All grades<\/div>\n        <p>Drawing, painting, ceramics and printmaking taught from a bright, north-facing studio. Senior students may submit a portfolio for CBSE Painting (Code 049) at Class XII.<\/p>\n      <\/div>\n      <div class=\"art-card amber\">\n        <div class=\"art-glyph\">✣<\/div>\n        <h4>Houses &amp; Leadership<\/h4>\n        <div class=\"grades\">Class V onwards<\/div>\n        <p>Four houses — Nanda, Trishul, Panchachuli, Shivling — competing across debate, quiz, sport, music and service. Captaincies elected by peers; mentor-supported, not staff-imposed.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ ACADEMIC SUPPORT ═══ -->\n  <section class=\"support-section\" id=\"support\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Academic Support &amp; Student Success<\/div>\n        <h2 class=\"sec-title\">No child is left to struggle quietly.<\/h2>\n        <p class=\"sec-intro\">Strong schools do not just produce toppers — they catch the child who needs an extra hour after class, and gently push the one who could go further. Here is how we do both, in the open, with the parent on board.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"sup-grid\">\n      <div class=\"sup-card\">\n        <div class=\"ic\">R<\/div>\n        <h4>Remedial &amp; Catch-up classes<\/h4>\n        <p>Subject-wise small-group sessions held twice a week after school, free of cost, for students whose internal assessments suggest they need a steadier pace. Attendance is invited, never punitive — and is reviewed each term with the parent and the class teacher.<\/p>\n        <span class=\"who\">Who: Classes IV – XII · By teacher recommendation<\/span>\n      <\/div>\n      <div class=\"sup-card\">\n        <div class=\"ic\">G<\/div>\n        <h4>Gifted-student enrichment<\/h4>\n        <p>Saturday morning enrichment for students excelling in Maths, Science, Languages or the Humanities — Olympiad preparation, advanced reading lists, supervised research projects, and visiting-scholar masterclasses each quarter.<\/p>\n        <span class=\"who\">Who: Classes VI – XII · By teacher nomination<\/span>\n      <\/div>\n      <div class=\"sup-card\">\n        <div class=\"ic\">M<\/div>\n        <h4>One-on-one mentor cadence<\/h4>\n        <p>Every student from Class VI is assigned a faculty mentor who meets them privately for 20 minutes once a fortnight in the middle school, and once a week through Classes XI–XII. Notes from these conversations stay confidential within the academic team.<\/p>\n        <span class=\"who\">Cadence: Fortnightly (VI–X) · Weekly (XI–XII)<\/span>\n      <\/div>\n      <div class=\"sup-card\">\n        <div class=\"ic\">P<\/div>\n        <h4>Pre-board &amp; mock-exam cycle<\/h4>\n        <p>For Class X and XII, three full pre-board cycles are conducted — September, December and January — each one in board-exact format, paper pattern and timing. Detailed item-analysis is shared with both student and parent within ten days of each cycle.<\/p>\n        <span class=\"who\">Where: Classes X &amp; XII · 3 cycles per year<\/span>\n      <\/div>\n      <div class=\"sup-card\">\n        <div class=\"ic\">C<\/div>\n        <h4>Parent communication rhythm<\/h4>\n        <p>Two formal Parent–Teacher meetings per term, monthly digital progress notes via the SPS Parent Portal, and a 24-hour reply commitment on email from class teachers. Report cards include both grades <em>and<\/em> a written paragraph from each subject teacher.<\/p>\n        <span class=\"who\">Cadence: 2 PTMs / term · Monthly digital updates<\/span>\n      <\/div>\n      <div class=\"sup-card\">\n        <div class=\"ic\">W<\/div>\n        <h4>Wellbeing &amp; counselling<\/h4>\n        <p>Two full-time counsellors on each campus — accessible to children at any time, on a walk-in basis, with parent involvement only where appropriate and consented. A weekly social-emotional learning class is timetabled for every grade up to Class IX.<\/p>\n        <span class=\"who\">Walk-in · Confidential · Free<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"integrity\">\n      <div>\n        <h4>Academic integrity, plainly stated.<\/h4>\n        <div class=\"tag\">SPS Honour Code<\/div>\n      <\/div>\n      <p>We expect honest work — in classrooms, in homework, in laboratories and in board examinations. Plagiarism, exam misconduct and AI-generated submissions presented as one's own are taken seriously and addressed first as a teaching moment, then if recurring, through a published disciplinary process. The intent is always to grow a child's character; the consequence is always proportionate.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ RESULTS / OUTCOMES ═══ -->\n  <section class=\"results-section\" id=\"results\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Academic Outcomes<\/div>\n        <h2 class=\"sec-title\">Twelve consecutive years of top CBSE results in Almora.<\/h2>\n        <p class=\"sec-intro\">Numbers below are the school's own reporting; full mark sheets and CBSE-issued certificates are available for parents to verify on appointment. Where 2024–25 data is provisional, we have flagged it.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"stat-strip\">\n      <div class=\"stat-cell\"><div class=\"num\">100%<\/div><div class=\"lbl\">Class X &amp; XII pass rate · 5 consecutive years<\/div><\/div>\n      <div class=\"stat-cell\"><div class=\"num\">87.4%<\/div><div class=\"lbl\">School average · CBSE Class XII 2024 [PLACEHOLDER · awaiting final tabulation]<\/div><\/div>\n      <div class=\"stat-cell\"><div class=\"num\">42<\/div><div class=\"lbl\">Students above 95% aggregate · Class X &amp; XII combined, 2023–24<\/div><\/div>\n      <div class=\"stat-cell\"><div class=\"num\">12+<\/div><div class=\"lbl\">Years of leading CBSE results in the Almora district<\/div><\/div>\n    <\/div>\n\n    <div class=\"results-table-wrap\">\n      <h4>Recent CBSE board results — for parent review<\/h4>\n      <div class=\"sub\">A snapshot of the last three sessions. Confirm any line item against the original mark sheet on file with the academics office.<\/div>\n      <table class=\"results-table\">\n        <thead>\n          <tr>\n            <th>Session<\/th>\n            <th>Class<\/th>\n            <th>Students appeared<\/th>\n            <th>Pass rate<\/th>\n            <th>School avg.<\/th>\n            <th>Highest<\/th>\n            <th>Subject toppers<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody>\n          <tr>\n            <td>2024–25<\/td>\n            <td>XII<\/td>\n            <td>112<\/td>\n            <td class=\"ok\">100%<\/td>\n            <td class=\"pct\">87.4%<\/td>\n            <td class=\"pct\">98.6%<\/td>\n            <td>5 [PLACEHOLDER · provisional]<\/td>\n          <\/tr>\n          <tr>\n            <td>2024–25<\/td>\n            <td>X<\/td>\n            <td>128<\/td>\n            <td class=\"ok\">100%<\/td>\n            <td class=\"pct\">89.1%<\/td>\n            <td class=\"pct\">99.0%<\/td>\n            <td>4<\/td>\n          <\/tr>\n          <tr>\n            <td>2023–24<\/td>\n            <td>XII<\/td>\n            <td>104<\/td>\n            <td class=\"ok\">100%<\/td>\n            <td class=\"pct\">86.2%<\/td>\n            <td class=\"pct\">98.2%<\/td>\n            <td>3<\/td>\n          <\/tr>\n          <tr>\n            <td>2023–24<\/td>\n            <td>X<\/td>\n            <td>121<\/td>\n            <td class=\"ok\">100%<\/td>\n            <td class=\"pct\">88.6%<\/td>\n            <td class=\"pct\">98.8%<\/td>\n            <td>6<\/td>\n          <\/tr>\n          <tr>\n            <td>2022–23<\/td>\n            <td>XII<\/td>\n            <td>98<\/td>\n            <td class=\"ok\">100%<\/td>\n            <td class=\"pct\">85.9%<\/td>\n            <td class=\"pct\">97.8%<\/td>\n            <td>4<\/td>\n          <\/tr>\n        <\/tbody>\n      <\/table>\n      <div class=\"results-actions\">\n        <a href=\"#\" class=\"amber\">Confirm my child's result &amp; report card<\/a>\n        <a href=\"#\">Download 5-year results PDF<\/a>\n        <a href=\"mailto:academics@shardaschool.in\">Email the academics office<\/a>\n      <\/div>\n    <\/div>\n\n    <div class=\"alumni-quotes\">\n      <div class=\"alq\">\n        <blockquote>\"The Maths department made me feel like JEE was a craft, not a war. I walked into IIT Madras already knowing how to study. That's the gift.\"<\/blockquote>\n        <div class=\"who\">\n          <div class=\"av\">AT<\/div>\n          <div>\n            <div class=\"nm\">[Aarav Tiwari]<\/div>\n            <div class=\"meta\">Class XII 2024 · Science · IIT Madras<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"alq\">\n        <blockquote>\"I came to Edinburgh from a hill town and felt prepared, not intimidated. SPS taught me to write, to argue, to defend an idea — that's what college actually demands.\"<\/blockquote>\n        <div class=\"who\">\n          <div class=\"av\">SK<\/div>\n          <div>\n            <div class=\"nm\">[Saira Khanna]<\/div>\n            <div class=\"meta\">Class XII 2023 · Humanities · Univ. of Edinburgh<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"alq\">\n        <blockquote>\"Commerce at SPS wasn't taught as memorising journal entries. We ran a school enterprise. By the time I started at LSR, I had already built and budgeted things.\"<\/blockquote>\n        <div class=\"who\">\n          <div class=\"av\">PR<\/div>\n          <div>\n            <div class=\"nm\">[Priya Raghav]<\/div>\n            <div class=\"meta\">Class XII 2024 · Commerce · LSR College, DU<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"destinations\">\n      <h4>Where our graduates go<\/h4>\n      <div class=\"sub\">A partial list from the last three graduating classes. Roughly 18% of every batch goes on to study abroad.<\/div>\n      <div class=\"dest-strip\">\n        <div class=\"dest-cell\"><div class=\"nm\">IIT Madras<\/div><div class=\"loc\">B.Tech<\/div><\/div>\n        <div class=\"dest-cell\"><div class=\"nm\">IIT Jodhpur<\/div><div class=\"loc\">B.Tech<\/div><\/div>\n        <div class=\"dest-cell\"><div class=\"nm\">AIIMS Rishikesh<\/div><div class=\"loc\">MBBS<\/div><\/div>\n        <div class=\"dest-cell\"><div class=\"nm\">St. Stephen's, DU<\/div><div class=\"loc\">Honours<\/div><\/div>\n        <div class=\"dest-cell\"><div class=\"nm\">Lady Shri Ram, DU<\/div><div class=\"loc\">Honours<\/div><\/div>\n        <div class=\"dest-cell\"><div class=\"nm\">Ashoka University<\/div><div class=\"loc\">Liberal Arts<\/div><\/div>\n        <div class=\"dest-cell\"><div class=\"nm\">NIT Uttarakhand<\/div><div class=\"loc\">B.Tech<\/div><\/div>\n        <div class=\"dest-cell\"><div class=\"nm\">NIFT<\/div><div class=\"loc\">Design<\/div><\/div>\n        <div class=\"dest-cell\"><div class=\"nm\">Univ. of Edinburgh<\/div><div class=\"loc\">UK · UG<\/div><\/div>\n        <div class=\"dest-cell\"><div class=\"nm\">Univ. of Melbourne<\/div><div class=\"loc\">AUS · UG &amp; PG<\/div><\/div>\n      <\/div>\n      <div class=\"dest-note\">More to be added as the 2024–25 cohort confirms admissions through the summer.<\/div>\n    <\/div>\n\n    <div class=\"geog\">\n      A small school in the Kumaon hills sending children, year after year, to the institutions other schools build entire brochures around — that is the quiet thing we are most proud of.\n    <\/div>\n  <\/section>\n\n  <!-- ═══ SIGNATURE PROGRAMS ═══ -->\n  <section class=\"sig-section\" id=\"signature\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Signature Academic Programs<\/div>\n        <h2 class=\"sec-title\">Five things you'll only find at SPS.<\/h2>\n        <p class=\"sec-intro\">Built carefully over the years, these programmes are how we go beyond the CBSE syllabus without abandoning it.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"sig-list\" style=\"border-top:1px solid var(--border)\">\n\n      <div class=\"sig-row\">\n        <div class=\"num\">01<\/div>\n        <div>\n          <h4>The SPS Olympiad Track<\/h4>\n          <div class=\"lvl\">Class V – XII · Maths · Science · English<\/div>\n          <p>Identified through internal screening tests each August, students opt-in to a structured year-long preparation cycle for SOF, NSO, IMO, NSEC and English Olympiad. Sessions are taught by our subject heads, supplemented by visiting trainers from Delhi twice a term — never at the cost of school work.<\/p>\n        <\/div>\n        <div class=\"sig-takeaway\">\n          <div class=\"k\">What students gain<\/div>\n          <div class=\"v\">A taste for problems that don't have neat one-mark answers — and a record of national-level performance that strengthens college applications.<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"sig-row\">\n        <div class=\"num\">02<\/div>\n        <div>\n          <h4>AI &amp; Robotics Elective Track<\/h4>\n          <div class=\"lvl\">Class VIII – XII · Project-based<\/div>\n          <p>The AI Lab is not a cupboard of kits — it is a working studio with a 3D printer, soldering bay, microcontrollers and a small server cluster. Students complete one capstone project a year, supervised by faculty trained at IIT Roorkee, and the senior team competes annually at WRO and Atal Tinkering Marathons.<\/p>\n        <\/div>\n        <div class=\"sig-takeaway\">\n          <div class=\"k\">What students gain<\/div>\n          <div class=\"v\">A working portfolio of built things — and the confidence to say \"I made this\" in any college interview.<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"sig-row\">\n        <div class=\"num\">03<\/div>\n        <div>\n          <h4>Reading &amp; Research Programme<\/h4>\n          <div class=\"lvl\">Class III – XII · Library-led<\/div>\n          <p>The SPS Library is staffed by two full-time librarians and runs a graded reading challenge every term, an annual book fair with regional publishers, and at least two author visits a year. From Class VIII onwards, every student undertakes one long-form research project annually — properly cited, peer-reviewed and bound.<\/p>\n        <\/div>\n        <div class=\"sig-takeaway\">\n          <div class=\"k\">What students gain<\/div>\n          <div class=\"v\">A reading habit they take with them — and the rare ability to write a real research paper before college.<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"sig-row\">\n        <div class=\"num\">04<\/div>\n        <div>\n          <h4>Career Counselling &amp; College Readiness<\/h4>\n          <div class=\"lvl\">Class XI – XII · 1:1 cadence<\/div>\n          <p>Two qualified counsellors guide students through stream selection (end of Class X), aptitude profiling (start of Class XI) and the full application cycle for JEE, NEET, CLAT, CUET, and overseas applications (UCAS, Common App). Mock interviews, SOP feedback and parent-included planning sessions are built into the schedule.<\/p>\n        <\/div>\n        <div class=\"sig-takeaway\">\n          <div class=\"k\">What students gain<\/div>\n          <div class=\"v\">Clarity about what comes after Class XII — and a plan, written down, that the family can hold onto.<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"sig-row\">\n        <div class=\"num\">05<\/div>\n        <div>\n          <h4>Environmental &amp; Community Learning<\/h4>\n          <div class=\"lvl\">All grades · Curriculum-linked<\/div>\n          <p>Our setting is the syllabus. Students study river systems on the Kosi, glacial geomorphology at Pindari, and Kumaoni folk-architecture in the village of Kasar Devi. Class IX onwards, each student commits to 30 hours of community service annually — with a partner village school, an Almora animal shelter, or a heritage-restoration trust.<\/p>\n        <\/div>\n        <div class=\"sig-takeaway\">\n          <div class=\"k\">What students gain<\/div>\n          <div class=\"v\">An education rooted in a place — and the habit of showing up for a community beyond their own.<\/div>\n        <\/div>\n      <\/div>\n\n    <\/div>\n  <\/section>\n\n  <!-- ═══ INTERNATIONAL FACULTY ═══ -->\n  <section class=\"intl-section\" id=\"international\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Visiting &amp; International Faculty<\/div>\n        <h2 class=\"sec-title\">Teachers who carry the world to Almora.<\/h2>\n        <p class=\"sec-intro\">Each year SPS hosts one full-residency international educator and three to four shorter-term visiting faculty. They teach alongside our staff for a full term, train our teachers in their subject area, and leave a piece of their classroom behind.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"intl-grid\">\n      <div class=\"intl-text\">\n        <div class=\"badge\">Joining · August 2026<\/div>\n        <p>Our 2026–27 visiting educator is Dr. Eleanor Whitcombe, joining us from the University of Cambridge as <strong>SPS Visiting Fellow in English &amp; Creative Writing<\/strong>. She will teach Class IX English for one term, run a Saturday creative-writing studio for Classes X–XII, and lead a fortnight of professional-development sessions for our middle-school humanities team.<\/p>\n        <p>Past international fellowships at SPS have included a French art historian (2024), a Singaporean robotics-curriculum lead (2023), and a Toronto-trained early-childhood specialist (2022) who now informs our Foundational Stage practice.<\/p>\n        <p>Visiting faculty teach <em>alongside<\/em> our regular teachers, never instead of them. Our students gain a window into another way of thinking; our staff gain a sustained masterclass.<\/p>\n      <\/div>\n\n      <div class=\"intl-card\">\n        <div class=\"top\">\n          <div class=\"intl-portrait\">EW<\/div>\n          <div>\n            <div class=\"nm\">Dr. Eleanor Whitcombe<\/div>\n            <div class=\"ti\">Visiting Fellow · English &amp; Creative Writing<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"meta-grid\">\n          <div>\n            <div class=\"k\">From<\/div>\n            <div class=\"v\">University of Cambridge, UK<\/div>\n          <\/div>\n          <div>\n            <div class=\"k\">Joining<\/div>\n            <div class=\"v\">August 2026 · Term I<\/div>\n          <\/div>\n          <div>\n            <div class=\"k\">Teaches<\/div>\n            <div class=\"v\">Class IX English · Sr. Writing Studio<\/div>\n          <\/div>\n          <div>\n            <div class=\"k\">Specialism<\/div>\n            <div class=\"v\">Modern poetry &amp; narrative non-fiction<\/div>\n          <\/div>\n        <\/div>\n        <blockquote>\"What drew me to SPS was the seriousness with which children are taught to read closely — and the silence of these mountains, in which I think they will write very well.\"<\/blockquote>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ EVENTS ═══ -->\n  <section class=\"events-section\" id=\"events\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Upcoming Events<\/div>\n        <h2 class=\"sec-title\">What's next on the academic calendar.<\/h2>\n        <p class=\"sec-intro\">Open events, exams and showcases through the next term. Parents are warmly invited unless an event is marked closed.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"ev-grid\">\n      <article class=\"ev\">\n        <div class=\"ev-date\"><span class=\"d\">14<\/span><span class=\"my\">May 2026<\/span><\/div>\n        <span class=\"pill acad\">Academic<\/span>\n        <h4>Class XII Result Reading &amp; PTM<\/h4>\n        <div class=\"where\">Senior Block, 9:30 am · By appointment<\/div>\n        <p>Individual mark-sheet review with the class teacher and counsellor. Stream-wise university counselling sessions in the afternoon.<\/p>\n        <div class=\"who\">For: Class XII parents &amp; students<\/div>\n      <\/article>\n      <article class=\"ev\">\n        <div class=\"ev-date\"><span class=\"d\">22<\/span><span class=\"my\">May 2026<\/span><\/div>\n        <span class=\"pill cult\">Cultural<\/span>\n        <h4>SPS Hill Film Festival 2026<\/h4>\n        <div class=\"where\">Almora Town Auditorium · 4:00 pm<\/div>\n        <p>Student-made documentaries on Kumaoni crafts, water and migration. Ten short films, two feature shorts. Open to the wider Almora community.<\/p>\n        <div class=\"who\">For: All families &amp; public<\/div>\n      <\/article>\n      <article class=\"ev\">\n        <div class=\"ev-date\"><span class=\"d\">02<\/span><span class=\"my\">Jun 2026<\/span><\/div>\n        <span class=\"pill acad\">Academic<\/span>\n        <h4>Olympiad Orientation 2026–27<\/h4>\n        <div class=\"where\">Lab Block, 11:00 am<\/div>\n        <p>For students newly inducted to the Olympiad track and their parents. Year plan, exam calendar, expected commitment, and Q&amp;A with the subject heads.<\/p>\n        <div class=\"who\">For: Classes V – XI<\/div>\n      <\/article>\n      <article class=\"ev\">\n        <div class=\"ev-date\"><span class=\"d\">15<\/span><span class=\"my\">Jul 2026<\/span><\/div>\n        <span class=\"pill acad\">Academic<\/span>\n        <h4>Welcome to Dr. Whitcombe<\/h4>\n        <div class=\"where\">Sr. Library · 10:00 am<\/div>\n        <p>A reading and conversation with our Visiting Fellow in English from Cambridge, on her first week on campus. Senior students and humanities staff invited.<\/p>\n        <div class=\"who\">For: Classes IX – XII<\/div>\n      <\/article>\n      <article class=\"ev\">\n        <div class=\"ev-date\"><span class=\"d\">28<\/span><span class=\"my\">Aug 2026<\/span><\/div>\n        <span class=\"pill sport\">Sport<\/span>\n        <h4>Inter-house Aquatic Meet<\/h4>\n        <div class=\"where\">Upper Campus Pool · 2:00 pm<\/div>\n        <p>The four houses compete across freestyle, breaststroke, butterfly and mixed relay. Refreshments served on the pool deck for visiting families.<\/p>\n        <div class=\"who\">For: Class III onwards · Parents welcome<\/div>\n      <\/article>\n      <article class=\"ev\">\n        <div class=\"ev-date\"><span class=\"d\">19<\/span><span class=\"my\">Sep 2026<\/span><\/div>\n        <span class=\"pill acad\">Academic<\/span>\n        <h4>Pre-board Cycle I — Class X &amp; XII<\/h4>\n        <div class=\"where\">Examination halls · Closed<\/div>\n        <p>The first of three pre-board cycles for boards-bound students. Item-analysed reports issued within ten working days, followed by individual remediation plans.<\/p>\n        <div class=\"who\">For: Classes X &amp; XII · Closed<\/div>\n      <\/article>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ VISIT BOX ═══ -->\n  <section class=\"visit-section\" id=\"visit\">\n    <div class=\"visit-box\">\n      <div>\n        <div class=\"lbl\">Coming on a Campus Visit?<\/div>\n        <h3>Five things to ask the academics team.<\/h3>\n        <p>We mean these as honest prompts for the conversation — not gotchas. Any school worth your child's eleven years should answer each of them clearly.<\/p>\n        <a href=\"About.html#admissions\" class=\"cta\">Schedule a visit<\/a>\n      <\/div>\n      <ol>\n        <li><strong>What does a regular Tuesday look like in Class IV (or my child's grade)?<\/strong> Don't ask about the philosophy — ask about the timetable.<\/li>\n        <li><strong>How are children who fall behind academically supported, with a specific example?<\/strong> The answer should be unhesitating and specific.<\/li>\n        <li><strong>What is your stance on outside tuition for board classes?<\/strong> SPS's view: it should not be necessary. Hear ours; hear theirs.<\/li>\n        <li><strong>How is parent-teacher communication handled outside of formal PTMs?<\/strong> Look for cadence, not promises.<\/li>\n        <li><strong>Show me last year's Class XII results, line by line — not just the average.<\/strong> A confident school will offer this before you ask.<\/li>\n      <\/ol>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ FAQ ═══ -->\n  <section class=\"faq-section\" id=\"faq\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Academic FAQ<\/div>\n        <h2 class=\"sec-title\">The questions parents ask most often.<\/h2>\n        <p class=\"sec-intro\">Brief, plain answers. If something is missing here, the academics office will pick up the phone — Mon–Sat, 8:30 am – 4:30 pm.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"faq-list\">\n      <details class=\"faq-item\">\n        <summary>How much homework does my child get each evening?<\/summary>\n        <p>By design, never more than 30 minutes a day in Classes I–III, an hour in IV–V, ninety minutes in VI–VIII, and roughly two hours in IX–XII. Weekend homework is restricted to project work and reading. If your child is regularly exceeding this, please tell the class teacher — that is information we want.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>Will my child need outside tuition or coaching to do well in board exams?<\/summary>\n        <p>It should not be necessary. Our 1:20 ratio, in-school remedial support, three pre-board cycles and Saturday concept clinics are designed precisely so that the school is enough. If a family chooses additional outside coaching, we ask them to share that with the class teacher so the schedules can be balanced — but we do not require, recommend, or partner with outside coaching institutes.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>Can I see real Class X / XII results, not just averages?<\/summary>\n        <p>Yes — on appointment with the academics office, we share the full anonymised result-strip for each of the last five sessions, along with subject-wise distribution. We do not publish topper photos online, but we are happy to walk parents through the numbers in detail.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>What is the language of instruction?<\/summary>\n        <p>English is the medium of instruction across all subjects, with Hindi as a compulsory second language up to Class X and an option at Class XI–XII. Classes Nursery–II are deliberately bilingual — children move between English and Hindi through the day, with Hindi storytelling protected as a daily practice. Sanskrit, French and Kumaoni Studies are offered as third-language electives in middle school.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>What is the school's policy on phones and digital devices?<\/summary>\n        <p>Personal mobile phones are not permitted on campus from Nursery to Class X. Senior students (XI–XII) may carry a phone but must deposit it at the start of the day. Tablets and laptops are issued by the school for specific assignments and used inside the classroom under supervision. Parents can reach a child during the day through the school office; we will fetch them.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>How are reports and progress shared with parents?<\/summary>\n        <p>Two formal Parent–Teacher meetings per term, plus monthly digital progress notes through the SPS Parent Portal. Term reports include numerical grades, written comments from each subject teacher, and a separate \"habits and effort\" rating that is not part of the academic average. Class teachers commit to replying to parent emails within one working day.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>How do you approach AI and ChatGPT in academic work?<\/summary>\n        <p>We teach with it, not against it. From Class VIII, students learn to use AI tools transparently, with citation. Submitting AI-generated work as one's own remains a violation of our honour code; using AI to brainstorm, summarise or check is permitted and supervised. Class XII students attend a dedicated session on AI ethics each year.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>How are mid-year admissions handled academically?<\/summary>\n        <p>A short diagnostic is conducted in English and Mathematics on admission. Where gaps are identified, the academics office prepares a four-to-six-week catch-up plan, often including the remedial track and a designated faculty mentor. We aim, in every case, to have a mid-year admit caught up to the class within one term — and we keep parents updated weekly.<\/p>\n      <\/details>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ CTA STRIP ═══ -->\n  <div class=\"cta-strip\">\n    <h3>Have a question this page didn't answer? <em>Write to academics directly.<\/em><\/h3>\n    <a href=\"mailto:academics@shardaschool.in\">Email academics →<\/a>\n  <\/div>\n\n  <!-- ═══ FOOTER ═══ -->\n  <footer>\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHAAAABwCAYAAADG4PRLAAAQAElEQVR4AexcCWBV1bVd9w2ZX+aRhAyQkDAkEMI8yCyDICBi0So4Yv3V3+nbarX9Vvs72Fqt/qr1F2xtsVULyCiDzKAg80wgZCQDmaeXOS9/7RMufQxaXiDRh+9yzz3jPefcvc7eZ+99XjDYbLY2m80VbDbnpIEBrsupKeAC0KnhA1wAugB0cgo4+fRdHOgC0Mkp4OTTd3GgC0Anp4CTT7+DHOjkX30TTd8FoJOD6QLQBaCTU8DJp+/iwK8CgBonIYGRo7cLQEcp1hnt29ipBEaO3i4AHaXYV6y9C8CvGCCOTscFoKMU+4q171oAv2IffzNMxwWgk6PoAtAFoJNTwMmn7+JAF4BOTgEnn76LA10AOjkFnHz6Lg50AdhBCjjgfe/gCF+L17qGA68GVge9718LVBz4yM4FUAfucrCkXA/6ZCWvp13xNVOg8wD8d4DooOrtJC9pCdc8fVfDzgNQALGnrwAjQcr0Oj2Wck0eUukKjlCgcwDUsdABkhlJWoKk7YOUSZAyPZa0fdD7kzL7tOS/5qFzAPw8IHRiXw2ENr50tfIvekev+xrHBpKt6z//8waVcgmXz0gv08WsAC3h8nZfw7yhq+nQRk6rq29AWUUV2vjPMZoLkl09Y8dm2NWtO0eEfs5XCPkLzpfiH//cgH+u2ITyimpCKKWf84JerDBTD72kPRaOvBjai+yeX4tklwIoEFRV1uIfSzdg/4GTKC4ug5T9W0oLxuTcf7WTtySoin8Vf vert(1); }\n    .nav-brand .name { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: #fff; display: block; line-height: 1; }\n    .nav-brand .motto { font-size: 9.5px; color: var(--amber-light); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 4px; display: block; }\n    .nav-center { flex: 1; display: flex; justify-content: center; }\n    .nav-links { display: flex; gap: 4px; list-style: none; }\n    .nav-links > li > a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; padding: 8px 14px; border-radius: 4px; transition: color 0.2s, background 0.2s; }\n    .nav-links > li > a:hover, .nav-links > li.active > a { color: #fff; background: rgba(255,255,255,0.1); }\n    .nav-right { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }\n    .nav-portal { color: rgba(255,255,255,0.7); font-size: 12.5px; text-decoration: none; padding: 7px 14px; border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; transition: all 0.2s; }\n    .nav-portal:hover { color: #fff; border-color: rgba(255,255,255,0.6); }\n    .nav-apply { background: var(--amber); color: #fff; padding: 9px 20px; border-radius: 4px; font-size: 13px; font-weight: 600; text-decoration: none; letter-spacing: 0.03em; transition: background 0.2s; }\n    .nav-apply:hover { background: var(--amber-light); }\n\n    /* OPEN BAR */\n    .open-bar { background: linear-gradient(90deg, var(--amber) 0%, var(--amber-light) 100%); color: #fff; padding: 12px 80px; display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-top: var(--nav-h); }\n    .open-bar .lt { display: flex; align-items: center; gap: 16px; }\n    .open-bar .pulse { width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 0 rgba(255,255,255,0.7); animation: pulse 2s infinite; }\n    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); } 70% { box-shadow: 0 0 0 12px rgba(
