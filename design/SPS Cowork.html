ss=\"crumb\">Home / Admissions<\/div>\n    <span class=\"head-tag\">CBSE · Affiliation No. 3530299 · Session 2025–26<\/span>\n    <h1>Join the SPS family.<\/h1>\n    <p class=\"lede\">Twenty-four years of CBSE academics in Almora — and a quiet, careful admissions process that begins with a conversation, not a form. Visit us. Walk through the classrooms. Meet a teacher. Then decide.<\/p>\n    <div class=\"anchors\">\n      <a href=\"#why\">Why SPS<\/a>\n      <a href=\"#age\">Age criteria<\/a>\n      <a href=\"#assessment\">Assessment<\/a>\n      <a href=\"#visit\">Visit campus<\/a>\n      <a href=\"#fees\">Fees<\/a>\n      <a href=\"#after\">After admission<\/a>\n      <a href=\"#faq\">FAQ<\/a>\n    <\/div>\n  <\/header>\n\n  <!-- ═══ WHY SPS ═══ -->\n  <section class=\"why-section\" id=\"why\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Why SPS<\/div>\n        <h2 class=\"sec-title\">A school chosen by 1,300 families across Kumaon.<\/h2>\n        <p class=\"sec-intro\">There are several good schools in Almora — we know that, and we respect them. Here is what we believe makes the choice of Sharda Public School worth the weight a parent gives it.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"pwelcome\">\n      <div class=\"av\">VS<\/div>\n      <div>\n        <div class=\"lbl\">A note from the Principal<\/div>\n        <blockquote>\"Choosing a school is the most important decision you will make for your child in these years. Come and meet us — sit in a classroom, walk by the swimming pool, ask the hardest questions you can think of. We have nothing to hide and a great deal to be proud of.\"<\/blockquote>\n        <div class=\"nm\">Mrs. Vinita Shekhar &nbsp;<em>· Principal, Sharda Public School<\/em><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"why-pillars\">\n      <div class=\"why-p\">\n        <div class=\"num\">01<\/div>\n        <h4>Results that consistently lead Almora<\/h4>\n        <p>Twelve consecutive years of leading CBSE results in the district, with a 1:20 teacher–student ratio that means your child is known by name and tracked individually. Board readiness is built into the timetable — not bought from outside coaching.<\/p>\n      <\/div>\n      <div class=\"why-p\">\n        <div class=\"num\">02<\/div>\n        <h4>Facilities most Almora schools don't have<\/h4>\n        <p>A working AI &amp; Robotics Lab with 3D printers and microcontrollers, a 25-metre heated swimming pool with certified coaches, science laboratories per CBSE norms and a film-making studio. Real facilities, used in the curriculum every week — not on a brochure.<\/p>\n      <\/div>\n      <div class=\"why-p\">\n        <div class=\"num\">03<\/div>\n        <h4>Twenty-three years of trust — and alumni at IIT &amp; Edinburgh<\/h4>\n        <p>Since 2001, families across Kumaon have sent their children to SPS. Our recent graduates are at IIT Madras, IIT Jodhpur, AIIMS, LSR &amp; St. Stephen's, the University of Edinburgh and Melbourne — sent there from a school in the hills, by teachers who knew them well.<\/p>\n      <\/div>\n    <\/div>\n\n    <p class=\"soft-cta\">Visit us. <a href=\"#visit\">See the difference in person.<\/a><\/p>\n  <\/section>\n\n  <!-- ═══ AGE ELIGIBILITY ═══ -->\n  <section class=\"age-section\" id=\"age\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Age Eligibility &amp; Class Criteria<\/div>\n        <h2 class=\"sec-title\">Which class is right for your child?<\/h2>\n        <p class=\"sec-intro\">SPS follows CBSE's age norms, which set the cut-off as on 31 March of the academic year [PLACEHOLDER: confirm SPS age cut-off date with admissions office]. Use this table as a starting point, then call us — there are always edge cases, and we are happy to walk through them.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"age-table-wrap\">\n      <table class=\"age-table\">\n        <thead>\n          <tr>\n            <th>Class<\/th>\n            <th>Minimum age (as on 31 March)<\/th>\n            <th>Cut-off date<\/th>\n            <th>Campus<\/th>\n            <th>Special notes<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody>\n          <tr>\n            <td class=\"cls\">Nursery<\/td>\n            <td class=\"age\">3 years completed<\/td>\n            <td>31 March 2025<\/td>\n            <td class=\"camp\">Junior Branch · Khatyari<\/td>\n            <td>Toilet-trained, comfortable away from parent for short periods<\/td>\n          <\/tr>\n          <tr>\n            <td class=\"cls\">LKG<\/td>\n            <td class=\"age\">4 years completed<\/td>\n            <td>31 March 2025<\/td>\n            <td class=\"camp\">Junior Branch · Khatyari<\/td>\n            <td>One year of pre-school recommended, not mandatory<\/td>\n          <\/tr>\n          <tr>\n            <td class=\"cls\">UKG<\/td>\n            <td class=\"age\">5 years completed<\/td>\n            <td>31 March 2025<\/td>\n            <td class=\"camp\">Junior Branch · Khatyari<\/td>\n            <td>—<\/td>\n          <\/tr>\n          <tr>\n            <td class=\"cls\">Class I<\/td>\n            <td class=\"age\">6 years completed<\/td>\n            <td>31 March 2025<\/td>\n            <td class=\"camp\">Junior Branch · Khatyari<\/td>\n            <td>Per NEP 2020 / CBSE norms<\/td>\n          <\/tr>\n          <tr>\n            <td class=\"cls\">Classes II – V<\/td>\n            <td class=\"age\">As per CBSE class-age table<\/td>\n            <td>31 March 2025<\/td>\n            <td class=\"camp\">Junior Branch · Khatyari<\/td>\n            <td>Lateral entry — Transfer Certificate (TC) required<\/td>\n          <\/tr>\n          <tr>\n            <td class=\"cls\">Classes VI – VIII<\/td>\n            <td class=\"age\">11 / 12 / 13 yrs as per class<\/td>\n            <td>31 March 2025<\/td>\n            <td class=\"camp\">Senior Branch · Dugalkhola<\/td>\n            <td>Lateral entry — TC + last year's report card<\/td>\n          <\/tr>\n          <tr>\n            <td class=\"cls\">Classes IX – X<\/td>\n            <td class=\"age\">14 / 15 yrs as per class<\/td>\n            <td>31 March 2025<\/td>\n            <td class=\"camp\">Senior Branch · Dugalkhola<\/td>\n            <td>TC mandatory · Class IX subject choice cycle<\/td>\n          <\/tr>\n          <tr>\n            <td class=\"cls\">Class XI<\/td>\n            <td class=\"age\">After Class X result<\/td>\n            <td>Within 15 days of CBSE Class X result<\/td>\n            <td class=\"camp\">Senior Branch · Dugalkhola<\/td>\n            <td>Stream allocation: Science / Commerce / Humanities<\/td>\n          <\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n\n    <div class=\"age-notes\">\n      <div class=\"age-note\">\n        <div class=\"k\">Mid-year &amp; lateral admissions<\/div>\n        <p>Mid-year admissions are accepted in <strong>Classes I to IX<\/strong> against any vacancy, subject to a short academic interaction. In addition to standard documents, you will need: <strong>TC, last year's final report card, current session's progress reports<\/strong>, and a <strong>migration certificate<\/strong> if transferring across boards.<\/p>\n      <\/div>\n      <div class=\"age-note\">\n        <div class=\"k\">Sibling preference<\/div>\n        <p>[PLACEHOLDER: confirm with admissions office whether SPS extends sibling priority to families with an existing child enrolled — and whether this is an automatic preference or a tie-breaker among equally placed candidates.]<\/p>\n      <\/div>\n      <div class=\"age-note\">\n        <div class=\"k\">EWS / RTE quota seats<\/div>\n        <p>As an unaided private school, SPS observes the spirit of the RTE Act, 2009. [PLACEHOLDER: confirm exact percentage of seats reserved for EWS / disadvantaged categories, the application window, and supporting income / caste documents required.]<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ ASSESSMENT ═══ -->\n  <section class=\"assess-section\" id=\"assessment\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">The Assessment · Step 3 of the Process<\/div>\n        <h2 class=\"sec-title\">What actually happens on assessment day.<\/h2>\n        <p class=\"sec-intro\">We have heard parents call this \"the test.\" It isn't, really — and it isn't meant to feel like one. Here is exactly what your child will experience, by age, with no surprises.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"assess-list\">\n      <div class=\"assess-row\">\n        <div class=\"stage\">Pre-school<br/><span class=\"lvl\">Nursery · LKG · UKG<\/span><\/div>\n        <div>\n          <p>This is <strong>not a written test<\/strong>. A class teacher and a counsellor sit with your child for a 20–30 minute play-based interaction — colouring, simple puzzles, picking up toys, listening to a short story, and a little chat. We are looking for <strong>readiness, curiosity and social comfort<\/strong>, not letters or numbers. Parents are with the child for the first few minutes and just outside the room afterwards. Please do not coach your child or quiz them in advance — it makes them anxious without helping.<\/p>\n        <\/div>\n        <div class=\"meta\">\n          <div class=\"k\">Format<\/div>\n          <div class=\"v\">20–30 min · Play-based<br/>Parent stays nearby<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"assess-row\">\n        <div class=\"stage\">Primary lateral entry<br/><span class=\"lvl\">Class I – V<\/span><\/div>\n        <div>\n          <p>A short, friendly written interaction in <strong>English, Hindi and Mathematics<\/strong>, set at the level of the class your child is applying to. The teacher reads the questions aloud where appropriate. There is also a brief reading-aloud session and a small chat with the class teacher. We are looking for class fit and any catch-up support that may be useful — never to filter a child out who simply needs a settling term.<\/p>\n        <\/div>\n        <div class=\"meta\">\n          <div class=\"k\">Format<\/div>\n          <div class=\"v\">~45 min written + 10 min chat<br/>Subjects per class level<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"assess-row\">\n        <div class=\"stage\">Middle &amp; Secondary<br/><span class=\"lvl\">Class VI – X<\/span><\/div>\n        <div>\n          <p>A written assessment in <strong>English, Hindi, Mathematics and Science<\/strong> (and Social Science from Class VIII), at the level of the class being applied to. This is followed by a 10–15 minute personal interaction with the academic head and the relevant subject teacher. For Class IX and X, the previous year's CBSE / school report card is reviewed alongside.<\/p>\n        <\/div>\n        <div class=\"meta\">\n          <div class=\"k\">Format<\/div>\n          <div class=\"v\">[PLACEHOLDER: 90 min written + interview]<br/>Conducted at Senior Branch<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"assess-row\">\n        <div class=\"stage\">Class XI · Stream selection<br/><span class=\"lvl\">Post Class X result<\/span><\/div>\n        <div>\n          <p>For Class XI, there is no separate written test for SPS students continuing from Class X. Stream allocation — <strong>Science, Commerce or Humanities<\/strong> — is based on the CBSE Class X result, subject preferences declared at the end of Class X, and the recommendation from the academic counsellor. New students applying from outside also bring their CBSE Class X mark sheet for the same conversation. <strong>Yes<\/strong> — every Class XI applicant gets a one-to-one counselling session before locking in a stream.<\/p>\n        <\/div>\n        <div class=\"meta\">\n          <div class=\"k\">Format<\/div>\n          <div class=\"v\">Counselling-led<br/>Class X result + interview<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"assess-reassure\">No child is judged on a single day. We are looking for <span>the right fit<\/span> — for them and for us.<\/div>\n  <\/section>\n\n  <!-- ═══ VISIT ═══ -->\n  <section class=\"visit-section\" id=\"visit\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Visit SPS<\/div>\n        <h2 class=\"sec-title\">There is nothing we love more than meeting a family.<\/h2>\n        <p class=\"sec-intro\">Brochures and websites can only do so much. Walk into a classroom mid-lesson; smell the chalk and the deodar; meet a teacher who has been here for fourteen years. That is the visit we would like to host you for.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"visit-grid\">\n      <div>\n        <div class=\"visit-tour\">\n          <h3>What a campus tour covers<\/h3>\n          <div class=\"sub\">Roughly 60–75 minutes · Senior Branch (with optional Junior Branch viewing)<\/div>\n          <ul class=\"tour-list\">\n            <li>Reception &amp; admissions office<\/li>\n            <li>A live primary classroom (with permission)<\/li>\n            <li>A live middle / senior classroom<\/li>\n            <li>Physics laboratory<\/li>\n            <li>Chemistry laboratory<\/li>\n            <li>Biology laboratory<\/li>\n            <li>Computer laboratory<\/li>\n            <li>AI &amp; Robotics Lab (with a demo)<\/li>\n            <li>Senior &amp; junior libraries<\/li>\n            <li>25-metre heated swimming pool<\/li>\n            <li>Sports field &amp; basketball court<\/li>\n            <li>Indoor sports — TT, badminton<\/li>\n            <li>Music &amp; dance rooms<\/li>\n            <li>Theatre / film-making studio<\/li>\n            <li>Art &amp; craft studio<\/li>\n            <li>Cafeteria &amp; sample meal<\/li>\n            <li>School clinic &amp; counsellor's office<\/li>\n            <li>Transport bay &amp; route map<\/li>\n            <li>Meeting with a teacher of your choice<\/li>\n            <li>15-min closing chat with admissions<\/li>\n          <\/ul>\n        <\/div>\n\n        <div class=\"visitor-quote\">\n          <div class=\"mark\">&ldquo;<\/div>\n          <div>\n            <blockquote>\"We came thinking we'd ask three or four questions and leave. We left two hours later with our minds made up. The school feels like itself, not like a brochure.\"<\/blockquote>\n            <div class=\"who\">[PLACEHOLDER: Parent name · Parent of [Child], Class III · Visited Feb 2025]<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"coordinator\">\n          <div class=\"av\">AC<\/div>\n          <div>\n            <div class=\"nm\">[PLACEHOLDER: Admissions Coordinator name]<\/div>\n            <div class=\"ti\">Admissions Coordinator · Senior Branch<\/div>\n          <\/div>\n          <a href=\"tel:+917300502640\">Call to book<\/a>\n        <\/div>\n      <\/div>\n\n      <div class=\"visit-side\">\n        <div class=\"visit-card\">\n          <h4>Book a campus tour<\/h4>\n          <p><strong>Senior Branch<\/strong>, Near Circuit House, Dugalkhola, Almora<br/><strong>Hours:<\/strong> Mon–Sat · 8:30 AM – 2:30 PM<br/>Walk-ins welcome, but a phone or WhatsApp booking lets us assign a teacher and a class to visit.<\/p>\n          <div class=\"row\">\n            <a class=\"amber\" href=\"tel:+917300502640\">📞 Call<\/a>\n            <a class=\"outl\" href=\"https://wa.me/917300502640\">WhatsApp<\/a>\n          <\/div>\n        <\/div>\n\n        <div class=\"ask-box\">\n          <div class=\"lbl\">On your visit<\/div>\n          <h4>Six questions every parent should ask.<\/h4>\n          <ol>\n            <li>Can I see the most recent Class X &amp; XII result, line by line?<\/li>\n            <li>What is the actual teacher–student ratio in my child's class?<\/li>\n            <li>Is outside tuition assumed for board classes? Why or why not?<\/li>\n            <li>How will I know how my child is doing — between formal PTMs?<\/li>\n            <li>What does the school do when a child is struggling academically or emotionally?<\/li>\n            <li>Can I meet a teacher who has been here longer than five years?<\/li>\n          <\/ol>\n        <\/div>\n\n        <div class=\"open-house\">\n          <div class=\"k\">Open House Days<\/div>\n          <p>[PLACEHOLDER: scheduled Open House / Admission Days for the 2025–26 cycle — add dates and timings here once finalised by the admissions office. Typical pattern: one Saturday morning event per month, December – March.]<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ FEES ═══ -->\n  <section class=\"fees-section\" id=\"fees\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Fees, Scholarships &amp; Financial Information<\/div>\n        <h2 class=\"sec-title\">Honest, clear, and shared in person.<\/h2>\n        <p class=\"sec-intro\">We do not publish a fee table on this page — and we want to explain why. Fees vary by class and by the optional services a family chooses. The full structure is shared at the admissions office, in a single sheet, with everything itemised.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"fees-intro-card\">\n      <p>\"<span>We believe every deserving child in Kumaon<\/span> should have access to quality education. Our fee structure is shaped around that conviction — and the admissions office will walk you through every line of it.\"<\/p>\n    <\/div>\n\n    <div class=\"fees-grid\">\n      <div class=\"fee-card\">\n        <div class=\"ic\">₹<\/div>\n        <h4>What the standard fee covers<\/h4>\n        <p>Tuition, CBSE registration &amp; examination charges, library and laboratory access, sports participation, co-curricular activities (music, art, theatre), school health-room services and parent-portal access.<\/p>\n        <ul>\n          <li>Tuition &amp; instruction<\/li>\n          <li>CBSE board fees (Class X &amp; XII)<\/li>\n          <li>Library &amp; laboratory usage<\/li>\n          <li>Sports facilities (incl. swimming pool)<\/li>\n          <li>Co-curricular &amp; house events<\/li>\n          <li>[PLACEHOLDER: confirm full inclusion list]<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"fee-card\">\n        <div class=\"ic\">+<\/div>\n        <h4>Optional add-ons<\/h4>\n        <p>Some services are charged separately so families can opt in only where they need them — keeping the base fee as lean as possible.<\/p>\n        <ul>\n          <li>School transport · GPS-tracked fleet, route-wise pricing<\/li>\n          <li>Cafeteria meals · monthly or daily<\/li>\n          <li>School uniform &amp; PE kit<\/li>\n          <li>Books &amp; stationery (CBSE list)<\/li>\n          <li>Optional add-on classes (e.g., Trinity music grades)<\/li>\n          <li>[PLACEHOLDER: confirm pricing tier per add-on]<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"fee-card\">\n        <div class=\"ic\">★<\/div>\n        <h4>Merit recognition &amp; concessions<\/h4>\n        <p>SPS recognises academic and sporting merit. [PLACEHOLDER: confirm whether the school offers merit-based fee concessions for top scorers (Class X &amp; XII), district / state / national-level sports achievers, or single-parent / armed-forces families. Add eligibility criteria, the size of the concession, and how to apply.]<\/p>\n      <\/div>\n      <div class=\"fee-card\">\n        <div class=\"ic\">⚖<\/div>\n        <h4>EWS &amp; RTE seats<\/h4>\n        <p>The Right to Education Act, 2009 mandates 25% reservation in entry-level classes of unaided private schools for children from economically weaker sections and disadvantaged groups. [PLACEHOLDER: confirm SPS's EWS application window, supporting income / caste documents, and the selection process — typically a state-conducted lottery.]<\/p>\n      <\/div>\n      <div class=\"fee-card\">\n        <div class=\"ic\">⟲<\/div>\n        <h4>Payment options<\/h4>\n        <p>Fees are payable [PLACEHOLDER: confirm cycle — quarterly / termly / annual]. Online payment via the SPS Parent Portal, NEFT, UPI and demand draft are accepted; cash is discouraged but available at the accounts counter. [PLACEHOLDER: confirm if instalment plans or sibling-discount options are available.]<\/p>\n      <\/div>\n      <div class=\"fee-card\">\n        <div class=\"ic\">!<\/div>\n        <h4>One-time admission charges<\/h4>\n        <p>A one-time registration fee is collected at the time of submitting the application form, and a separate admission fee on confirmation of a seat. Both amounts are shared in writing at the office. [PLACEHOLDER: confirm refund policy in case of withdrawal before the session begins.]<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"fees-close\">\n      <p>\"For complete fee details, please visit our admissions office or call us — we are happy to walk you through everything, line by line, with no obligation.\"<\/p>\n      <div class=\"row\">\n        <a class=\"amber\" href=\"tel:+917300502640\">Call admissions · +91 73005 02640<\/a>\n        <a class=\"outl\" href=\"mailto:admission@shardapublicschool.com\">Email for fee schedule<\/a>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ AFTER ADMISSION ═══ -->\n  <section class=\"after-section\" id=\"after\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">After Admission<\/div>\n        <h2 class=\"sec-title\">What happens between confirmation and the first morning.<\/h2>\n        <p class=\"sec-intro\">Once your child has a seat, our work really begins. Here is the rhythm of the days between admission and the first morning of school — so nothing is unexpected.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"after-grid\">\n      <div class=\"after-card\">\n        <div class=\"step\">Step 1 · The week of admission<\/div>\n        <h4>Welcome call &amp; portal set-up<\/h4>\n        <p>A welcome call from the class teacher within five working days. Parent Portal credentials are issued, the family WhatsApp group for the class is shared, and you are walked through the school's app and notice-board.<\/p>\n      <\/div>\n      <div class=\"after-card\">\n        <div class=\"step\">Step 2 · 4–6 weeks before session<\/div>\n        <h4>Orientation &amp; Welcome Day<\/h4>\n        <p>[PLACEHOLDER: confirm orientation date for 2025–26 cohort.] A half-day on campus where new students meet their class teacher and classmates, walk through the school, and parents receive the year's calendar, syllabus, and key policies.<\/p>\n      <\/div>\n      <div class=\"after-card\">\n        <div class=\"step\">Step 3 · 3–4 weeks before<\/div>\n        <h4>Uniform, books &amp; supplies<\/h4>\n        <p>School uniform is sourced from [PLACEHOLDER: confirm designated vendor / school uniform shop &amp; address]. The CBSE booklist is provided at orientation; books may be purchased from [PLACEHOLDER: school book counter / authorised vendors]. A small starter stationery kit is distributed on Day 1.<\/p>\n      <\/div>\n      <div class=\"after-card\">\n        <div class=\"step\">Step 4 · 2–3 weeks before<\/div>\n        <h4>Transport registration<\/h4>\n        <p>The SPS school bus fleet is GPS-tracked and runs on fixed routes across Almora and surrounding areas. Route map and pickup-point allocation is confirmed with the transport office on registration. <strong>[PLACEHOLDER: transport coordinator name &amp; direct number].<\/strong><\/p>\n      <\/div>\n      <div class=\"after-card\">\n        <div class=\"step\">Step 5 · Ongoing<\/div>\n        <h4>Parent communication channels<\/h4>\n        <p>Daily: school diary (Nursery–V) or Parent Portal app (VI–XII). Weekly: class WhatsApp group moderated by the class teacher. Monthly: digital progress note. Termly: formal Parent–Teacher Meeting. [PLACEHOLDER: confirm exact app / portal in use for 2025–26.]<\/p>\n      <\/div>\n      <div class=\"after-card\">\n        <div class=\"step\">Step 6 · Day 1<\/div>\n        <h4>The first morning<\/h4>\n        <p>You will be expected at the gate by 8:00 AM. The class teacher is at the door. Parents of Nursery–KG students are welcome to stay for the first 30 minutes; parents of older students are walked through a short coffee briefing in the visitor lounge.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"checklist\">\n      <div>\n        <div class=\"lbl\">Day 1 Checklist<\/div>\n        <h3>What to bring on the first morning.<\/h3>\n        <p>Keep it light — we'd rather your child arrive at 8 a.m. unhurried, than fully equipped. Anything missing on Day 1 is genuinely fine; we'll sort it together that week.<\/p>\n      <\/div>\n      <ul>\n        <li><strong>School ID card<\/strong> &amp; transport tag (issued at orientation)<\/li>\n        <li><strong>School diary<\/strong> with the parent-acknowledgement page signed<\/li>\n        <li><strong>Water bottle<\/strong> (refillable) — labelled with the child's name<\/li>\n        <li><strong>Nutritious snack<\/strong> &amp; lunch box (cafeteria opt-in if registered)<\/li>\n        <li><strong>Stationery<\/strong> as per the orientation list — no extra books needed Day 1<\/li>\n        <li><strong>One change of clothes<\/strong> for Nursery–KG, in the school bag<\/li>\n        <li><strong>An emergency contact card<\/strong> with two numbers, in the front pocket of the bag<\/li>\n      <\/ul>\n    <\/div>\n\n    <p class=\"closing-line\">We are here every step of the way. Sharda Public School is a community first, and an institution second — and from your child's first morning, you are part of it.<\/p>\n  <\/section>\n\n  <!-- ═══ FAQ ═══ -->\n  <section class=\"faq-section\" id=\"faq\">\n    <div class=\"sec-head-row\">\n      <div>\n        <div class=\"sec-eyebrow\">Admissions FAQ<\/div>\n        <h2 class=\"sec-title\">The questions parents ask most often.<\/h2>\n        <p class=\"sec-intro\">If your question is not here, the admissions office picks up the phone every Mon–Sat between 8:30 AM and 2:30 PM at <a href=\"tel:+917300502640\" style=\"color:var(--amber);\">+91 73005 02640<\/a>.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"faq-list\">\n      <details class=\"faq-item\">\n        <summary>What is the last date to apply for Session 2025–26?<\/summary>\n        <p>Forms for Session 2025–26 are accepted on a rolling basis until classes fill. [PLACEHOLDER: confirm with school office whether there is a hard cut-off date — typically late February for Nursery and Class I, and within 15 days of the CBSE Class X result for Class XI.] We strongly recommend applying early; popular classes close before the cut-off.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>Can my child join mid-year — after April?<\/summary>\n        <p>Yes, in Classes I to IX, against any vacancy that may exist. Mid-year admissions follow the same process — enquiry, registration, a short academic interaction and confirmation. You will additionally need the current session's progress reports from the previous school, and a migration certificate if transferring across boards. Class X and XII mid-year admissions are accepted only in exceptional circumstances per CBSE rules.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>Is there a written entrance test for Nursery, LKG or UKG?<\/summary>\n        <p>No. The pre-school assessment is a 20–30 minute play-based interaction — not a test. We are looking for readiness, curiosity and social comfort, never academic skills. Please do not coach your child or quiz them in advance; it makes them anxious without helping.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>My child studied in a Hindi-medium school. Can they join SPS?<\/summary>\n        <p>Yes — and many of our current students started exactly that way. SPS is an English-medium school, but our middle and primary teachers are trained to support a transition. Where helpful, we suggest a four-to-six-week language-bridge programme using our remedial track, included in the regular fee. The aim is for your child to feel settled by the end of the first term.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>What is the medium of instruction at SPS?<\/summary>\n        <p>English is the medium of instruction across all subjects, with Hindi as a compulsory second language up to Class X. In Nursery to Class II classrooms are deliberately bilingual — children move between English and Hindi through the day, with Hindi storytelling protected as a daily practice. Sanskrit, French and Kumaoni Studies are offered as third-language electives in middle school.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>Are there seats reserved for EWS / weaker sections?<\/summary>\n        <p>The RTE Act, 2009 mandates 25% reservation in entry-level classes of unaided private schools for children from economically weaker sections and disadvantaged groups. [PLACEHOLDER: confirm SPS's EWS application window, supporting income / caste documents, and selection method.] We are committed to supporting these admissions wholeheartedly.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>Does SPS offer school transport? Which areas are covered?<\/summary>\n        <p>Yes. The SPS school bus fleet is GPS-tracked, with female attendants on each bus and certified drivers. Routes cover central Almora, Khatyari, Dwarahat road, Dugalkhola, Mall Road and surrounding pickup points; [PLACEHOLDER: confirm full list of covered routes and route-wise pricing tiers]. Pickup-point allocation is confirmed at the time of registration with the transport office.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>Can I get the fee structure online or over the phone?<\/summary>\n        <p>The full fee structure is shared in person at the admissions office or by email on request, because optional add-ons (transport, cafeteria, kits) materially change the total. We are very happy to send you the complete itemised sheet — please email <a href=\"mailto:admission@shardapublicschool.com\" style=\"color:var(--amber);\">admission@shardapublicschool.com<\/a> or call us, and we will share it the same day.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>My child is appearing for Class X boards. Can I apply for Class XI now?<\/summary>\n        <p>Yes. Class XI registration opens before CBSE Class X results are announced; you can submit a provisional registration form now and confirm the seat within 15 days of the result. Stream allocation — Science, Commerce or Humanities — happens through a one-to-one counselling session once results are in.<\/p>\n      <\/details>\n      <details class=\"faq-item\">\n        <summary>Is there a sibling discount or priority for brothers and sisters of existing students?<\/summary>\n        <p>[PLACEHOLDER: confirm with admissions office whether SPS offers a sibling fee concession, and / or a sibling-priority preference where seats are limited. Please add the size of the concession (if any) and the application process.] As a general rule, families with an existing child at SPS are warmly encouraged to apply early — we want to keep brothers and sisters together where we can.<\/p>\n      <\/details>\n    <\/div>\n  <\/section>\n\n  <!-- ═══ CTA STRIP ═══ -->\n  <div class=\"cta-strip\" id=\"enquire\">\n    <h3>Still have a question? <em>The admissions office is one call away.<\/em><\/h3>\n    <a href=\"tel:+917300502640\">📞 +91 73005 02640<\/a>\n  <\/div>\n\n  <!-- ═══ FOOTER ═══ -->\n  <footer>\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHAAAABwCAYAAADG4PRLAAAQAElEQVR4AexcCWBV1bVd9w2ZX+aRhAyQkDAkEMI8yCyDICBi0So4Yv3V3+nbarX9Vvs72Fqt/qr1F2xtsVULyCiDzKAg80wgZCQDmaeXOS9/7RMufQxaXiDRh+9yzz3jPefcvc7eZ+99XjDYbLY2m80VbDbnpIEBrsupKe -btn.remind:hover { background: rgba(200,131,26,0.1); }\n\n    .schedule-table {\n      background: #fff; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;\n    }\n    .st-header {\n      display: grid; grid-template-columns: 80px 1fr 1fr 1fr 1fr 1fr;\n      background: var(--snow); border-bottom: 1px solid var(--border);\n      padding: 10px 16px;\n    }\n    .st-header span { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }\n    .st-row {\n      display: grid; grid-template-columns: 80px 1fr 1fr 1fr 1fr 1fr;\n      padding: 12px 16px; border-bottom: 1px solid var(--border);\n      align-items: center; transition: background 0.2s;\n    }\n    .st-row:last-child { border-bottom: none; }\n    .st-row:hover { background: var(--snow); }\n    .st-time { font-size: 12px; font-weight: 600; color: var(--navy); }\n    .st-subject {\n      padding: 5px 12px; border-radius: 3px; font-size: 12px; font-weight: 600;\n      text-align: center; cursor: pointer; transition: all 0.2s;\n    }\n    .st-subject:empty::after { content: '—'; color: var(--border); font-weight: 400; }\n    .s-math { background: #e8f0fe; color: #1a56db; }\n    .s-sci { background: var(--forest-pale); color: var(--forest); }\n    .s-eng { background: #fef9e7; color: #b7950b; }\n    .s-hin { background: #fdf3f3; color: var(--red); }\n    .s-sst { background: #f3eafd; color: #6b21a8; }\n    .s-live { position: relative; }\n    .s-live::after { content: '● LIVE'; position: absolute; top: -6px; right: -4px; font-size: 8px; font-weight: 800; color: var(--red); letter-spacing: 0.06em; }\n\n    /* ── RESULTS PANEL ── */\n    .results-summary {\n      display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 28px;\n    }\n    .score-ring-card {\n      background: #fff; border-radius: 4px; border: 1px solid var(--border);\n      padding: 28px; display: flex; flex-direction: column; align-items: center; justify-content: cent lor: var(--muted); text-align: center; padding: 4px 0; }\n    .cal-cell {\n      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;\n      border-radius: 3px; font-size: 12px; font-weight: 500; color: var(--text);\n      cursor: default;\n    }\n    .cal-cell.present { background: rgba(27,77,48,0.12); color: var(--forest); font-weight: 700; }\n    .cal-cell.absent { background: rgba(192,57,43,0.1); color: var(--red); font-weight: 700; }\n    .cal-cell.late { background: rgba(200,131,26,0.12); color: var(--amber); font-weight: 700; }\n    .cal-cell.holiday { background: var(--sky-light); color: var(--sky); }\n    .cal-cell.today { background: var(--navy); color: #fff; font-weight: 700; }\n    .cal-cell.empty { pointer-events: none; }\n\n    /* ── ENROLLMENT PANEL ── */\n    .enroll-header {\n      background: linear-gradient(135deg, var(--amber) 0%, #8b4a0a 100%);\n      border-radius: 6px; padding: 36px; margin-bottom: 28px; position: relative; overflow: hidden;\n    }\n    .enroll-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: #fff; margin-bottom: 8px; }\n    .enroll-header p { font-size: 14px; color: rgba(255,255,255,0.75); max-width: 500px; }\n    .enroll-header .credits-badge {\n      position: absolute; top: 28px; right: 36px;\n      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);\n      color: #fff; padding: 10px 20px; border-radius: 4px; text-align: center;\n    }\n    .credits-badge .num { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 700; line-height: 1; }\n    .credits-badge .lbl { font-size: 11px; letter-spacing: 0.1em; opacity: 0.75; margin-top: 2px; }\n\n    .enroll-cats { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }\n    .ecat-btn {\n      padding: 8px 20px; border-radius: 20px; border: 1.5px solid var(--border);\n      font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;\n      background: #fff; transition: all 0.2s;\n    }\n    .ecat-btn.active, .ecat-btn:hover { background: var(--forest); border-color: var(--forest); color: #fff; }\n\n    .enroll-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }\n    .enroll-card {\n      background: #fff; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;\n      transition: all 0.25s; position: relative;\n    }\n    .enroll-card:hover { box-shadow: 0 8px 28px rgba(27,77,48,0.1); transform: translateY(-2px); }\n    .enroll-card.enrolled { border-color: var(--forest-mid); }\n    .ec-thumb {\n      height: 100px; display: flex; align-items: center; justify-content: center;\n      font-size: 36px; position: relative;\n    }\n    .enrolled-ribbon {\n      position: absolute; top: 10px; right: 10px;\n      background: var(--forest); color: #fff; padding: 3px 10px;\n      border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em;\n    }\n    .spots-ribbon {\n      position: absolute; top: 10px; right: 10px;\n      background: var(--red-pale); color: var(--red); padding: 3px 10px;\n      border-radius: 3px; font-size: 10px; font-weight: 700;\n    }\n    .ec-body { padding: 16px; }\n    .ec-cat { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--forest-mid); margin-bottom: 4px; }\n    .ec-body h4 { font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }\n    .ec-body p { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }\n    .ec-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }\n    .ec-tag { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }\n    .ec-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }\n    .ec-spots { font-size: 12px; color: var(--muted); }\n    .ec-spots span { font-weight: 700; color: var(--navy); }\n    .enroll-btn {\n      padding: 8px 18px; border-radius: 3px; font-size: 12px; font-weight: 700;\n      cursor: pointer; border: none; letter-spacing: 0.04em; transition: all 0.2s;\n    }\n    .enroll-btn.enroll { background: var(--forest); color: #fff; }\n    .enroll-btn.enroll:hover { background: var(--forest-mid); }\n    .enroll-btn.unenroll { background: var(--red-pale); color: var(--red); border: 1px solid rgba(192,57,43,0.2); }\n    .enroll-btn.unenroll:hover { background: rgba(192,57,43,0.15); }\n    .enroll-btn.full { background: var(--snow); color: var(--muted); cursor: not-allowed; }\n\n    /* My enrolled classes */\n    .my-classes { margin-top: 32px; }\n    .mc-list { display: flex; flex-direction: column; gap: 2px; background: var(--border); border-radius: 4px; overflow: hidden; }\n    .mc-item {\n      display: grid; grid-template-columns: 48px 1fr auto auto;\n      align-items: center; gap: 16px;\n      background: #fff; padding: 14px 20px;\n      transition: background 0.2s;\n    }\n    .mc-item:hover { background: var(--snow); }\n    .mc-icon { width: 40px; height: 40px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 20px; }\n    .mc-info h5 { font-size: 14px; font-weight: 600; color: var(--navy); }\n    .mc-info span { font-size: 12px; color: var(--muted); }\n    .mc-sched { font-size: 12px; color: var(--forest-mid); font-weight: 600; }\n    .mc-drop { font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 10px; border-radius: 3px; transition: all 0.2s; }\n    .mc-drop:hover { background: var(--red-pale); color: var(--red); }\n\n    /* ── ASSIGNMENTS ── */\n    .asgn-tab {\n      padding: 8px 18px; border-radius: 3px; border: 1.5px solid rgba(255,255,255,0.25);\n      color: rgba(255,255,255,0.7); font-size: 12.5px; font-weight: 600;\n      cursor: pointer; background: transparent; transition: all 0.2s;\n    }\n    .asgn-tab:hover, .asgn-tab.active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.6); color: #fff; }\n    .asgn-card {\n      background: #fff; border: 1px solid var(--border); border-radius: 4px;\n      padding: 22px 24px; display: flex; align-items: flex-start; justify-content: space-between;\n      gap: 20px; transition: all 0.2s;\n    }\n    .asgn-card:hover { box-shadow: 0 6px 24px rgba(22,40,64,0.08); }\n    .asgn-card.urgent { border-left: 4px solid var(--red); }\n    .asgn-card.warn   { border-left: 4px solid var(--amber); }\n    .asgn-card.normal { border-left: 4px solid var(--sky); }\n    .asgn-card.submitted { border-left: 4px solid var(--forest-mid); }\n    .asgn-card.graded { border-left: 4px solid var(--amber); background: var(--warm); }\n    .asgn-left { display: flex; gap: 16px; align-items: flex-start; flex: 1; min-width: 0; }\n    .asgn-subject-icon {\n      width: 44px; height: 44px; border-radius: 4px; flex-shrink: 0;\n      display: flex; align-items: center; justify-content: center; font-size: 20px;\n    }\n    .asgn-meta { flex: 1; min-width: 0; }\n    .asgn-subject-tag {\n      display: inline-block; padding: 2px 10px; border-radius: 20px;\n      font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;\n      margin-bottom: 6px;\n    }\n    .asgn-subject-tag.green  { background: var(--forest-pale); color: var(--forest-mid); }\n    .asgn-subject-tag.blue   { background: var(--sky-light); color: var(--sky); }\n    .asgn-subject-tag.purple { background: #f3eafd; color: #6b21a8; }\n    .asgn-subject-tag.amber  { background: #fdf5e8; color: var(--amber); }\n    .asgn-meta h4 { font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 6px; line-height: 1.3; }\n    .asgn-meta p  { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }\n    .asgn-info-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }\n    .due-urgent { color: var(--red); font-weight: 700; }\n    .due-warn   { color: var(--amber); font-weight: 700; }\n    .due-normal { color: var(--sky); font-weight: 600; }\n    .asgn-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; flex-shrink: 0; min-width: 140px; }\n    .asgn-status-badge {\n      padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700;\n      letter-spacing: 0.06em; white-space: nowrap;\n    }\n    .asgn-status-badge.urgent    { background: var(--red-pale); color: var(--red); }\n    .asgn-status-badge.warn      { background: #fdf5e8; color: var(--amber); }\n    .asgn-status-badge.normal    { background: var(--sky-light); color: var(--sky); }\n    .asgn-status-badge.submitted { background: var(--forest-pale); color: var(--forest-mid); }\n    .asgn-status-badge.graded    { background: var(--forest-pale); color: var(--forest); }\n    .asgn-btn {\n      padding: 9px 18px; border-radius: 3px; font-size: 12.5px; font-weight: 700;\n      cursor: pointer; border: none; transition: all 0.2s; white-space: nowrap;\n      letter-spacing: 0.03em; width: 100%; text-align: center;\n    }\n    .asgn-btn.primary { background: var(--forest); color: #fff; }\n    .asgn-btn.primary:hover { background: var(--forest-mid); }\n    .asgn-btn.ghost { background: var(--snow); color: var(--navy); border: 1px solid var(--border); }\n    .asgn-btn.ghost:hover { background: var(--cream); }\n\n    /* Feedback box */\n    .feedback-box { background: var(--snow); border-radius: 4px; padding: 16px; margin-top: 14px; border: 1px solid var(--border); }\n    .fb-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }\n    .fb-score { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1; }\n    .fb-grade { background: var(--forest-pale); color: var(--forest); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 800; }\n    .fb-stars { color: var(--forest-mid); font-size: 14px; letter-spacing: 2px; margin-left: auto; }\n -- SUBMIT MODAL -->\n      <div id=\"submit-modal\" style=\"display:none;position:fixed;inset:0;background:rgba(22,40,64,0.6);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);\">\n        <div style=\"background:#fff;border-radius:6px;width:100%;max-width:560px;box-shadow:0 24px 64px rgba(0,0,0,0.25);overflow:hidden;\">\n          <div style=\"background:var(--forest);padding:24px 28px;display:flex;justify-content:space-between;align-items:center;\">\n            <div>\n              <div style=\"font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:4px;\">Submit Assignment<\/div>\n              <h3 id=\"modal-title\" style=\"font-family:'Cormorant Garamond',serif;font-size:20px;color:#fff;font-weight:600;\"><\/h3>\n            <\/div>\n            <button onclick=\"closeSubmit()\" style=\"background:rgba(255,255,255,0.1);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;\">✕<\/button>\n          <\/div>\n          <div style=\"padding:28px;\">\n            <div style=\"margin-bottom:20px;\">\n              <label style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px;\">Written Answer / Notes<\/label>\n              <textarea id=\"submit-text\" placeholder=\"Type your answer, notes, or a message to your teacher here…\" style=\"width:100%;height:120px;border:1.5px solid var(--border);border-radius:4px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);resize:vertical;outline:none;transition:border-color 0.2s;\" onfocus=\"this.style.borderColor='var(--forest)'\" onblur=\"this.style.borderColor='var(--border)'\"><\/textarea>\n            <\/div>\n            <div style=\"margin-bottom:20px;\">\n              <label style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px;\">Attach File (PDF, JPG, DOC)<\/label>\n              <div id=\"drop-zone\" style=\"border:2px dashed var(--border);border-radius:4px;padding:28px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--snow);\" onclick=\"document.getElementById('file-input').click()\" ondragover=\"event.preventDefault();this.style.borderColor='var(--forest)';this.style.background='var(--forest-pale)'\" ondragleave=\"this.style.borderColor='var(--border)';this.style.background='var(--snow)'\" ondrop=\"handleDrop(event)\">\n                <div style=\"font-size:28px;margin-bottom:8px;\">📎<\/div>\n                <div style=\"font-size:13px;font-weight:600;color:var(--navy);margin-bottom:4px;\">Click to upload or drag & drop<\/div>\n                <div style=\"font-size:11.5px;color:var(--muted);\">PDF, JPG, PNG, DOCX — Max 20MB<\/div>\n              <\/div>\n              <input type=\"file\" id=\"file-input\" style=\"display:none;\" accept=\".pdf,.jpg,.jpeg,.png,.doc,.docx\" onchange=\"handleFile(this.files[0])\">\n              <div id=\"file-preview\" style=\"display:none;margin-top:10px;padding:10px 14px;background:var(--forest-pale);border-radius:4px;display:none;align-items:center;gap:10px;font-size:13px;color:var(--forest);\">\n                <span>📄<\/span><span id=\"file-name\"><\/span>\n                <span onclick=\"clearFile()\" style=\"margin-left:auto;cursor:pointer;color:var(--red);font-weight:700;\">✕ Remove<\/span>\n              <\/div>\n            <\/div>\n            <div style=\"background:var(--snow);border-radius:4px;padding:14px;margin-bottom:20px;font-size:12.5px;color:var(--muted);line-height:1.6;\">\n              🔒 Your submission is securely stored and visible to your teacher and parents. A timestamp is recorded on submission.\n            <\/div>\n            <div style=\"display:flex;gap:12px;justify-content:flex-end;\">\n              <button onclick=\"closeSubmit()\" style=\"padding:10px 22px;border:1.5px solid var(--border);border-radius:3px;background:#fff;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all 0.2s;\" onmouseover=\"this.style.borderColor=var('--navy')\" >Cancel<\/button>\n              <button onclick=\"submitAssignment()\" style=\"padding:10px 28px;background:var(--forest);border:none;border-radius:3px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:0.04em;transition:background 0.2s;\" onmouseover=\"this.style.background='var(--forest-mid)'\" onmouseout=\"this.style.background='var(--forest)'\">Submit Assignment →<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n    <\/div><!-- /content -->\n  <\/div><!-- /main -->\n\n  <!-- Toast -->\n  <div class=\"toast\" id=\"toast\"><\/div>\n\n  <script>\n    // Panel switching\n    function showPanel(id, el) {\n      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));\n      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));\n      document.getElementById('panel-' + id).classList.add('active');\n      if (el) el.classList.add('active');\n      const titles = { dashboard: ['Dashboard','Home'], live: ['Live & Video Classes','Classes'], results: ['Academic Results','Records'], attendance: ['Attendance','Records'], enroll: ['Course Enrollment','Courses'], assignments: ['Assignments','Learning'] };\n      const t = titles[id] || [id, id];\n      document.getElementById('panel-title').textContent = t[0];\n      document.getElementById('panel-crumb').textContent = t[1];\n    }\n\n    // Filters for live classes\n    function setFilter(btn, val) {\n      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n      showToast('Showing: ' + btn.textContent.trim(), 'info');\n    }\n\n    // Enrollment filter\n    function filterEnroll(btn, cat) {\n      document.querySelectorAll('.ecat-btn').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n      document.querySelectorAll('.enroll-card').forEach(card => {\n        if (cat === 'all' || card.dataset.cat === cat) {\n          card.style.display = '';\n        } else {\n          card.style.display = 'none';\n        }\n      });\n    }\n\n    // Toggle enrollment\n    function toggleEnroll(btn, name) {\n      const card = btn.closest('.enroll-card');\n      const isEnrolled = card.classList.contains('enrolled');\n      if (isEnrolled) {\n        card.classList.remove('enrolled');\n        btn.textContent = 'Enroll';\n        btn.className = 'enroll-btn enroll';\n        card.querySelector('.enrolled-ribbon').remove();\n        showToast('Dropped: ' + name, 'info');\n      } else {\n        card.classList.add('enrolled');\n        btn.textContent = 'Drop Course';\n        btn.className = 'enroll-btn unenroll';\n        const thumb = card.querySelector('.ec-thumb');\n        const rib = document.createElement('div');\n        rib.className = 'enrolled-ribbon';\n        rib.textContent = '✓ Enrolled';\n        thumb.appendChild(rib);\n        showToast('Enrolled in: ' + name + ' ✓', 'success');\n      }\n    }\n\n    // Assignment tab switching\n    function switchAsgnTab(btn, tab) {\n      document.querySelectorAll('.asgn-tab').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n      ['pending','submitted','graded'].forEach(t => {\n        const el = document.getElementById('asgn-' + t);\n        if (el) el.style.display = 'none';\n      });\n      if (tab === 'all') {\n        ['pending','submitted','graded'].forEach(t => {\n          const el = document.getElementById('asgn-' + t);\n          if (el) el.style.display = 'block';\n        });\n      } else {\n        const el = document.getElementById('asgn-' + tab);\n        if (el) el.style.display = 'block';\n      }\n    }\n\n    // Submit modal\n    function openSubmit(title) {\n      document.getElementById('modal-title').textContent = title;\n      document.getElementById('submit-text').value = '';\n      clearFile();\n      const modal = document.getElementById('submit-modal');\n      modal.style.display = 'flex';\n    }\n    function closeSubmit() {\n      document.getElementById('submit-modal').style.display = 'none';\n    }\n    function submitAssignment() {\n      const text = document.getElementById('submit-text').value.trim();\n      const fileName = document.getElementById('file-name').textContent;\n      if (!text && !fileName) {\n        showToast('Please add a written answer or attach a file.', 'info');\n        return;\n      }\n      closeSubmit();\n      showToast('✅ Assignment submitted successfully! Your teacher has been notified.', 'success');\n    }\n    function handleFile(file) {\n      if (!file) return;\n      document.getElementById('file-name').textContent = file.name;\n      const prev = document.getElementById('file-preview');\n      prev.style.display = 'flex';\n      const dz = document.getElementById('drop-zone');\n      dz.style.borderColor = 'var(--forest)';\n      dz.style.background = 'var(--forest-pale)';\n    }\n    function clearFile() {\n      document.getElementById('file-name').textContent = '';\n      document.getElementById('file-preview').style.display = 'none';\n      document.getElementById('file-input').value = '';\n      const dz = document.getElementById('drop-zone');\n      dz.style.borderColor = 'var(--border)';\n      dz.style.background = 'var(--snow)';\n    }\n    function handleDrop(e) {\n      e.preventDefault();\n      const file = e.dataTransfer.files[0];\n      if (file) handleFile(file);\n      document.getElementById('drop-zone').style.borderColor = 'var(--border)';\n      document.getElementById('drop-zone').style.background = 'var(--snow)';\n    }\n    // Close modal on backdrop click\n    document.getElementById('submit-modal').addEventListener('click', function(e) {\n      if (e.target === this) closeSubmit();\n    });\n\n    // Toast\n    function showToast(msg, type='info') {\n      const t = document.getElementById('toast');\n      t.textContent = msg;\n      t.className = 'toast ' + type + ' show';\n      clearTimeout(window._toastTimer);\n      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);\n    }\n  <\/script>\n<\/body>\n<\/html>\n","Teacher Portal.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Teacher Portal — Sharda Public School<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap\" rel=\"stylesheet\" />\n  <style>\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n    :root {\n      --forest: #1b4d30; --forest-mid: #286640; --forest-light: #3d8f5a;\n      --forest-pale: #e8f4ec;\n      --navy: #162840; --navy-mid: #1e3a5c;\n      --amber: #c8831a; --amber-light: #e8a030; --amber-pale: #fdf5e8;\n      --sky: #2f7ea8; --sky-light: #e8f4fb;\n      --red: #c0392b; --red-pale: #fdf0ef;\n      --purple: #6b21a8; --purple-pale: #f3eafd;\n      --warm: #faf9f6; --snow: #f5f8fa; --cream: #f2ede4;\n      --border: #dce8e0; --text: #1a2418; --muted: #52645a;\n      --sidebar-w: 260px;\n      --teacher-accent: #1e3a5c;\n    }\n    html { font-size: 16px; }\n    body { font-family: 'DM Sans', sans-serif; background: var(--snow); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }\n\n    /* ── SIDEBAR ── */\n    .sidebar {\n      width: var(--sidebar-w); background: var(--teacher-accent);\n      min-height: 100vh; display: flex; flex-direction: column;\n      position: fixed; top: 0; left: 0; z-index: 100; overflow-y: auto;\n    }\n    .sidebar-logo {\n      padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.07);\n      display: flex; align-items: center; gap: 10px; text-decoration: none;\n    }\n    .sidebar-logo img { height: 38px; filter: brightness(0) invert(1); }\n    .sidebar-logo-text .name { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; color: #fff; }\n    .sidebar-logo-text .sub { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; letter-spacing: 0.1em; }\n\n    .sidebar-user {\n      padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.07);\n      display: flex; align-items: center; gap: 12px;\n    }\n    .user-av {\n      width: 42px; height: 42px; border-radius: 50%;\n      background: var(--navy); display: flex; align-items: center; justify-content: center;\n      font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0;\n    }\n    .user-info .name { font-size: 13.5px; font-weight: 600; color: #fff; }\n    .user-info .role { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }\n    .user-badge { margin-left: auto; background: var(--amber); color: #fff; font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.08em; }\n\n    .sidebar-nav { padding: 14px 0; flex: 1; }\n    .nav-section { padding: 12px 20px 4px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.25); }\n    .nav-item {\n      display: flex; align-items: center; gap: 12px; padding: 11px 20px;\n      cursor: pointer; color: rgba(255,255,255,0.6); font-size: 13.5px; font-weight: 500;\n      transition: all 0.2s; border-left: 3px solid transparent; text-decoration: none;\n    }\n    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }\n    .nav-item.active { color: #fff; background: rgba(255,255,255,0.08); border-left-color: var(--amber-light); }\n    .nav-item .ni-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }\n    .ni-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }\n    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.07); }\n    .sidebar-footer a { color: rgba(255,255,255,0.4); font-size: 12.5px; text-decoration: none; transition: color 0.2s; }\n    .sidebar-footer a:hover { color: rgba(255,255,255,0.8); }\n\n    /* ── MAIN ── */\n    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }\n\n    /* ── TOPBAR ── */\n    .topbar {\n      background: #fff; border-bottom: 1px solid var(--border);\n      padding: 0 36px; height: 64px;\n      display: flex; align-items: center; justify-content: space-between;\n      position: sticky; top: 0; z-index: 50;\n    }\n    .topbar-title { font-size: 17px; font-weight: 600; color: var(--navy); }\n    .topbar-right { display: flex; align-items: center; gap: 14px; }\n    .tb-btn {\n      padding: 8px 18px; border-radius: 3px; font-size: 13px; font-weight: 700;\n      cursor: pointer; border: none; transition: all 0.2s; text-decoration: none;\n    }\n    .tb-btn.primary { background: var(--forest); color: #fff; }\n    .tb-btn.primary:hover { background: var(--forest-mid); }\n    .tb-btn.ghost { background: none; border: 1.5px solid var(--border); color: var(--navy); }\n    .tb-btn.ghost:hover { border-color: var(--navy); }\n    .tb-date { font-size: 12px; color: var(--muted); }\n    .tb-notif { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; position: relative; }\n    .tb-notif .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--red); border-radius: 50%; border: 1.5px solid #fff; }\n\n    /* ── CONTENT ── */\n    .content { padding: 32px 36px; flex: 1; }\n    .panel { display: none; }\n    .panel.active { display: block; }\n\n    /* ── SHARED COMPONENTS ── */\n    .sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }\n    .sec-head h3 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: var(--navy); }\n    .sec-head button, .sec-head a { font-size: 12px; font-weight: 700; color: var(--forest-mid); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; cursor: pointer; }\n\n    /* ── DASHBOARD ── */\n    .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }\n    .dash-card { background: #fff; padding: 22px 24px; border-radius: 4px; border: 1px solid var(--border); position: relative; overflow: hidden; }\n    .dash-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }\n    .dash-card.green::before { background: var(--forest-mid); }\n    .dash-card.amber::before { background: var(--amber); }\n    .dash-card.blue::before  { background: var(--sky); }\n    .dash-card.red::before   { background: var(--red); }\n    .dc-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }\n    .dc-val { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 700; line-height: 1; color: var(--navy); }\n    .dc-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }\n    .dc-icon { position: absolute; bottom: 14px; right: 18px; font-size: 28px; opacity: 0.08; }\n\n    /* ── ASSIGNMENT PANEL ── */\n    .asgn-header {\n      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);\n      border-radius: 6px; padding: 36px; margin-bottom: 28px; position: relative; overflow: hidden;\n    }\n    .asgn-header::before { content: ''; position: absolute; inset: 0; background: url(\"data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E\"); }\n    .asgn-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 30px; color: #fff; margin-bottom: 6px; position: relative; z-index:1; }\n    .asgn-header p { font-size: 14px; color: rgba(255,255,255,0.6); position: relative; z-index:1; }\n    .asgn-header-actions { display: flex; gap: 10px; margin-top: 20px; position: relative; z-index:1; }\n    .ahbtn {\n      padding: 10px 22px; border-radius: 3px; font-size: 13px; font-weight: 700;\n      cursor: pointer; border: none; transition: all 0.2s; letter-spacing: 0.04em;\n    }\n    .ahbtn.primary { background: var(--amber); color: #fff; }\n    .ahbtn.primary:hover { background: var(--amber-light); }\n    .ahbtn.ghost { background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; }\n    .ahbtn.ghost:hover { background: rgba(255,255,255,0.18); }\n\n    /* Class filter tabs */\n    .class-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }\n    .ctab {\n      padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border);\n      font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer;\n      background: #fff; transition: all 0.2s;\n    }\n    .ctab.active, .ctab:hover { background: var(--navy); border-color: var(--navy); color: #fff; }\n\n    /* Assignment list table */\n    .asgn-table { background: #fff; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 32px; }\n    .at-head {\n      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 120px;\n      background: var(--snow); padding: 10px 20px; border-bottom: 1px solid var(--border);\n    }\n    .at-head span { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }\n    .at-row {\n      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 120px;\n      padding: 14px
